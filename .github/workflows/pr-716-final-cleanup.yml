name: PR 716 Final Cleanup
# Retrigger after supplying the required TLS secret paths.

on:
  push:
    branches:
      - jules-3578797244930525994-2c5c0eb4
    paths:
      - .github/workflows/pr-716-final-cleanup.yml

permissions:
  contents: read

concurrency:
  group: pr-716-final-cleanup
  cancel-in-progress: false

jobs:
  cleanup-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout current branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: jules-3578797244930525994-2c5c0eb4
          fetch-depth: 0

      - name: Restore canonical npm baseline and remove planning artifacts
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- frontend/package.json frontend/package-lock.json
          rm -f fix_plan*.txt
          cd frontend
          npm pkg set 'dependencies.@dagrejs/dagre=^3.1.0'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test "$(node -p "require('./package.json').dependencies['@dagrejs/dagre']")" = '^3.1.0'
          test "$(node -p "Boolean(require('./package.json').dependencies.undici)")" = 'false'

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend complete coverage
        working-directory: frontend
        run: npm run coverage

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Validate production deployment configuration
        run: |
          set -euo pipefail
          mkdir -p secrets
          printf '%s\n' 'test-only-app-secret-material' > secrets/app_secret
          printf '%s\n' 'test-only-certificate' > secrets/tls_cert
          printf '%s\n' 'test-only-private-key' > secrets/tls_key
          POSTGRES_PASSWORD='test-only-database-password' \
          PUBLIC_ORIGIN='https://erd.example.test' \
          TLS_CERTIFICATE_FILE='./secrets/tls_cert' \
          TLS_PRIVATE_KEY_FILE='./secrets/tls_key' \
          docker compose -f compose.prod.yaml config >/dev/null
          rm -rf secrets

      - name: Publish verified cleanup
        run: |
          set -euo pipefail
          rm .github/workflows/pr-716-final-cleanup.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(scope): remove temporary plans and canonicalize npm lock'
          git push origin HEAD:jules-3578797244930525994-2c5c0eb4
