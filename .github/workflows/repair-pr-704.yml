name: Repair PR 704 Dependency Drift

on:
  push:
    branches:
      - palette/accessible-disabled-button-5390012025943726862

permissions:
  contents: write

concurrency:
  group: repair-pr-704-dependency-drift
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.head_commit.message == 'chore: repair PR 704 dependency drift'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: palette/accessible-disabled-button-5390012025943726862
          fetch-depth: 0

      - name: Restore canonical frontend dependency manifests
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- frontend/package.json frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Full frontend coverage
        working-directory: frontend
        run: npm run coverage

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Commit verified repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-pr-704.yml
          git diff --exit-code origin/main -- frontend/package.json frontend/package-lock.json
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(frontend): restore canonical dependency lockfiles'
          git pull --rebase origin palette/accessible-disabled-button-5390012025943726862
          git push origin 'HEAD:palette/accessible-disabled-button-5390012025943726862'
