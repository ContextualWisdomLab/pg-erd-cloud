SNOWFLAKE_ACCOUNT_RE = re.compile(r"^[A-Za-z0-9_-]+(?:\\.[A-Za-z0-9_-]+)*$")
SNOWFLAKE_SERVICE_SUFFIXES = (
    ".snowflakecomputing.com",
    ".snowflakecomputing.cn",
)


def _snowflake_connection_host(account: str) -> str:
    """Return the exact TLS hostname the connector derives for an account."""

    normalized = account.lower().rstrip(".")
    if normalized == "localhost" or normalized.endswith(".localhost"):
        raise DsnTargetError("database host must not be localhost")

    try:
        literal_ip = ipaddress.ip_address(normalized)
    except ValueError:
        literal_ip = None
    if literal_ip is not None:
        if (
            literal_ip.is_private
            or literal_ip.is_loopback
            or literal_ip.is_link_local
            or literal_ip.is_multicast
            or literal_ip.is_reserved
            or literal_ip.is_unspecified
        ):
            raise DsnTargetError("database host resolves to a restricted IP range")
        raise DsnTargetError("Snowflake account identifier must not be an IP address")

    if normalized.endswith(SNOWFLAKE_SERVICE_SUFFIXES):
        raise ValueError(
            "Snowflake account identifier must not include the Snowflake service domain"
        )
    if not SNOWFLAKE_ACCOUNT_RE.fullmatch(normalized):
        raise ValueError("invalid Snowflake account identifier")

    labels = normalized.split(".")
    top_level_domain = (
        "cn" if len(labels) > 1 and labels[1].startswith("cn-") else "com"
    )
    return f"{normalized}.snowflakecomputing.{top_level_domain}"


