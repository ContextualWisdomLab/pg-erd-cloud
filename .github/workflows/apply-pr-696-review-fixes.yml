name: Apply PR 696 review fixes

on:
  push:
    branches:
      - palette-form-submission-2191064457221307953
    paths:
      - .tmp/pr696-review-fix-ready

concurrency:
  group: apply-pr-696-review-fixes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply bounded review fixes
        env:
          REVIEWED_HEAD: 9fe90618b13f828a63f5930d3705349bb1127c19
          WORKFLOW_PATH: .github/workflows/apply-pr-696-review-fixes.yml
          READY_PATH: .tmp/pr696-review-fix-ready
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$REVIEWED_HEAD" HEAD
          staged_files="$(git diff --name-only "$REVIEWED_HEAD"...HEAD | sort)"
          expected_files="$(printf '%s\n' "$READY_PATH" "$WORKFLOW_PATH" | sort)"
          test "$staged_files" = "$expected_files"

          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/App.coverage.test.tsx")
          text = path.read_text(encoding="utf-8")

          helper_anchor = "function forceClick(button: HTMLButtonElement) {\n"
          helper = '''function buildTestDsn(scheme: string, authority: string, path = '') {\n  const pathSuffix = path ? `/${path}` : ''\n  return [scheme, ':', '/', '/', authority, pathSuffix].join('')\n}\n\n'''
          if helper not in text:
              if helper_anchor not in text:
                  raise SystemExit("forceClick helper anchor not found")
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          old_project = '''    const newProjectInput = screen.getByLabelText('New project')\n    await user.clear(newProjectInput)\n    vi.mocked(api.createProject).mockClear()\n    await user.type(newProjectInput, 'New{Enter}')\n    await waitFor(() => expect(api.createProject).toHaveBeenCalledTimes(1))\n    expect(api.createProject).toHaveBeenCalledWith('New')\n\n    const dsn = screen.getByLabelText('Connection DSN')\n    fireEvent.change(dsn, { target: { value: 'postgresql://[' } })\n    vi.mocked(api.createConnection).mockClear()\n    await user.type(dsn, '{Enter}')\n    expect(screen.getByRole('alert')).toHaveTextContent('Connection DSN must use')\n    expect(api.createConnection).not.toHaveBeenCalled()\n\n    fireEvent.change(dsn, { target: { value: 'http://bad.example/db' } })\n    await user.type(dsn, '{Enter}')\n    expect(screen.getByRole('alert')).toHaveTextContent('Connection DSN must use')\n    expect(api.createConnection).not.toHaveBeenCalled()\n    expect(dsn).toHaveValue('')\n\n    // 3. Editor view New Connection via Enter\n    fireEvent.change(dsn, { target: { value: 'postgresql://db.example/test' } })\n    await user.type(dsn, '{Enter}')\n    await waitFor(() => expect(api.createConnection).toHaveBeenCalledTimes(1))\n    expect(api.createConnection).toHaveBeenCalledWith('p3', 'target-db', 'postgresql://db.example/test')\n'''
          new_project = '''    const newProjectInput = screen.getByLabelText('New project')\n    await user.clear(newProjectInput)\n    vi.mocked(api.createProject).mockClear()\n    await user.type(newProjectInput, '   {Enter}')\n    expect(api.createProject).not.toHaveBeenCalled()\n    await user.clear(newProjectInput)\n    await user.type(newProjectInput, 'New{Enter}')\n    await waitFor(() => expect(api.createProject).toHaveBeenCalledTimes(1))\n    expect(api.createProject).toHaveBeenCalledWith('New')\n\n    const projectSelect = screen.getByLabelText('Project')\n    const connectionName = screen.getByLabelText('New connection (DSN)')\n    const dsn = screen.getByLabelText('Connection DSN')\n    const saveConnection = screen.getByRole('button', { name: 'Save connection' })\n    vi.mocked(api.createConnection).mockClear()\n\n    fireEvent.change(projectSelect, { target: { value: '' } })\n    expect(saveConnection).toBeDisabled()\n    await user.type(dsn, '{Enter}')\n    expect(api.createConnection).not.toHaveBeenCalled()\n\n    fireEvent.change(projectSelect, { target: { value: 'p3' } })\n    fireEvent.change(connectionName, { target: { value: '   ' } })\n    fireEvent.change(dsn, { target: { value: '   ' } })\n    expect(saveConnection).toBeDisabled()\n    await user.type(dsn, '{Enter}')\n    expect(api.createConnection).not.toHaveBeenCalled()\n\n    fireEvent.change(connectionName, { target: { value: 'target-db' } })\n    await user.clear(dsn)\n    expect(saveConnection).toBeDisabled()\n    await user.type(dsn, '{Enter}')\n    expect(api.createConnection).not.toHaveBeenCalled()\n\n    fireEvent.change(dsn, { target: { value: buildTestDsn('postgresql', '[') } })\n    await user.type(dsn, '{Enter}')\n    expect(screen.getByRole('alert')).toHaveTextContent('Connection DSN must use')\n    expect(api.createConnection).not.toHaveBeenCalled()\n\n    fireEvent.change(dsn, { target: { value: buildTestDsn('http', 'bad.example', 'db') } })\n    await user.type(dsn, '{Enter}')\n    expect(screen.getByRole('alert')).toHaveTextContent('Connection DSN must use')\n    expect(api.createConnection).not.toHaveBeenCalled()\n    expect(dsn).toHaveValue('')\n\n    // 3. Editor view New Connection via Enter\n    const validDsn = buildTestDsn('postgresql', 'db.example', 'test')\n    vi.mocked(api.createConnection).mockClear()\n    fireEvent.change(dsn, { target: { value: validDsn } })\n    await user.type(dsn, '{Enter}')\n    await waitFor(() => expect(api.createConnection).toHaveBeenCalledTimes(1))\n    expect(api.createConnection).toHaveBeenCalledWith('p3', 'target-db', validDsn)\n'''
          if old_project not in text:
              raise SystemExit("project/connection test anchor not found")
          text = text.replace(old_project, new_project, 1)

          old_canvas = '''    const canvasSearchInput = screen.getByLabelText('테이블 또는 컬럼 검색')\n    fireEvent.change(canvasSearchInput, { target: { value: 'users' } })\n    const canvasSearchForm = canvasSearchInput.closest('form')\n    const canvasSubmitEvent = new Event('submit', { cancelable: true, bubbles: true })\n    if (canvasSearchForm) canvasSearchForm.dispatchEvent(canvasSubmitEvent)\n    expect(canvasSubmitEvent.defaultPrevented).toBe(true)\n\n    expect(screen.getByText('1개 테이블 일치', { exact: false })).toBeInTheDocument()\n'''
          new_canvas = '''    const user = userEvent.setup({ advanceTimers: vi.advanceTimersByTime })\n    const canvasSearchInput = screen.getByLabelText('테이블 또는 컬럼 검색')\n    const canvasSearchCallCounts = {\n      listProjects: api.listProjects.mock.calls.length,\n      listConnections: api.listConnections.mock.calls.length,\n      listSnapshots: api.listSnapshots.mock.calls.length,\n      getSnapshot: api.getSnapshot.mock.calls.length,\n    }\n    const canvasSearchLocation = window.location.href\n    await user.clear(canvasSearchInput)\n    await user.type(canvasSearchInput, 'users{Enter}')\n    const canvasSearchForm = canvasSearchInput.closest('form')\n    const canvasSubmitEvent = new Event('submit', { cancelable: true, bubbles: true })\n    if (canvasSearchForm) canvasSearchForm.dispatchEvent(canvasSubmitEvent)\n    expect(canvasSubmitEvent.defaultPrevented).toBe(true)\n\n    expect(screen.getByText('1개 테이블 일치', { exact: false })).toBeInTheDocument()\n    expect(api.listProjects).toHaveBeenCalledTimes(canvasSearchCallCounts.listProjects)\n    expect(api.listConnections).toHaveBeenCalledTimes(canvasSearchCallCounts.listConnections)\n    expect(api.listSnapshots).toHaveBeenCalledTimes(canvasSearchCallCounts.listSnapshots)\n    expect(api.getSnapshot).toHaveBeenCalledTimes(canvasSearchCallCounts.getSnapshot)\n    expect(window.location.href).toBe(canvasSearchLocation)\n'''
          if old_canvas not in text:
              raise SystemExit("canvas search test anchor not found")
          text = text.replace(old_canvas, new_canvas, 1)

          text = text.replace(
              "fireEvent.change(screen.getByLabelText('Connection DSN'), { target: { value: 'postgresql://db.example/test' } })",
              "fireEvent.change(screen.getByLabelText('Connection DSN'), { target: { value: buildTestDsn('postgresql', 'db.example', 'test') } })",
          )

          forbidden = ("postgresql://", "snowflake://", "http://bad.example")
          remaining = [value for value in forbidden if value in text]
          if remaining:
              raise SystemExit(f"complete DSN literals remain: {remaining}")

          path.write_text(text, encoding="utf-8")
          PY

          git diff --check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run typecheck
          npm run coverage
          npm run build

      - name: Publish verified patch and remove bootstrap files
        env:
          REVIEWED_HEAD: 9fe90618b13f828a63f5930d3705349bb1127c19
          TARGET_BRANCH: palette-form-submission-2191064457221307953
          WORKFLOW_PATH: .github/workflows/apply-pr-696-review-fixes.yml
          READY_PATH: .tmp/pr696-review-fix-ready
        run: |
          set -euo pipefail
          rm -f "$WORKFLOW_PATH" "$READY_PATH"
          rmdir .tmp 2>/dev/null || true
          test "$(git diff --name-only "$REVIEWED_HEAD" -- | sort)" = "frontend/src/App.coverage.test.tsx"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "test(frontend): cover complete keyboard form contracts"
          test "$(git diff --name-only "$REVIEWED_HEAD"...HEAD | sort)" = "frontend/src/App.coverage.test.tsx"
          git push origin "HEAD:${TARGET_BRANCH}"
