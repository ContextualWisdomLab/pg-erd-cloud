name: PR 693 Workflow Probe

on:
  push:
    branches:
      - bolt-react-flow-cache-5569281215077212328
    paths:
      - .github/workflows/pr-693-probe.yml

permissions:
  contents: write

jobs:
  publish-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: bolt-react-flow-cache-5569281215077212328
          fetch-depth: 0

      - name: Publish probe receipt
        run: |
          set -euo pipefail
          printf 'PR 693 branch workflow executed at source head %s.\n' "$GITHUB_SHA" > .github/pr-693-workflow-probe.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pr-693-workflow-probe.txt
          git commit -m "ci: record PR 693 workflow execution"
          git push origin HEAD:bolt-react-flow-cache-5569281215077212328
