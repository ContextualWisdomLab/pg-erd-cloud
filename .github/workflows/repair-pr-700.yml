name: Repair PR 700 Search Race

on:
  push:
    branches:
      - bolt/optimize-handle-lookup-17383827529551263442

permissions:
  contents: write

concurrency:
  group: repair-pr-700-search-race
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.head_commit.message == 'chore: repair PR 700 search race'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bolt/optimize-handle-lookup-17383827529551263442
          fetch-depth: 0

      - name: Stabilize asynchronous diagram-search coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/App.coverage.test.tsx')
          text = path.read_text(encoding='utf-8')
          old = """    fireEvent.click(screen.getAllByRole('button', { name: '열기' })[1]!)
              expect(screen.getByRole('heading', { name: '다이어그램' })).toBeInTheDocument()
              fireEvent.change(screen.getByLabelText('다이어그램 검색'), { target: { value: 'no-match' } })
              expect(screen.getByText('검색 결과가 없습니다.')).toBeInTheDocument()
          """
          new = """    fireEvent.click(screen.getAllByRole('button', { name: '열기' })[1]!)
              expect(screen.getByRole('heading', { name: '다이어그램' })).toBeInTheDocument()
              await waitFor(() =>
                expect(
                  screen.queryByText(
                    '아직 다이어그램 스냅샷이 없습니다. 편집기에서 데이터베이스를 역공학해 시작하세요.',
                  ),
                ).not.toBeInTheDocument(),
              )
              fireEvent.change(screen.getByLabelText('다이어그램 검색'), { target: { value: 'no-match' } })
              expect(screen.getByText('검색 결과가 없습니다.')).toBeInTheDocument()
          """
          if text.count(old) != 1:
              raise SystemExit(f'expected one search-race block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Full frontend coverage
        working-directory: frontend
        run: npm run coverage

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Commit verified repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-pr-700.yml
          git add frontend/src/App.coverage.test.tsx
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(frontend): await diagram data before search assertion'
          git push origin 'HEAD:bolt/optimize-handle-lookup-17383827529551263442'
