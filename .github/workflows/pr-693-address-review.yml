name: PR 693 Current-Head Review Repair

on:
  push:
    branches:
      - bolt-react-flow-cache-5569281215077212328
    paths:
      - .github/workflows/pr-693-address-review.yml

permissions:
  contents: write

concurrency:
  group: pr-693-current-head-review-repair
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout current branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: bolt-react-flow-cache-5569281215077212328
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Add failing regressions first
        run: python .github/pr-693-repair.py red

      - name: Prove confirmation regressions fail before implementation
        run: |
          set +e
          npm --prefix frontend exec vitest run src/coverageGaps.test.tsx
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected the single-confirmation regressions to fail before implementation.' >&2
            exit 1
          fi

      - name: Implement review fixes
        run: python .github/pr-693-repair.py implement

      - name: Verify focused regressions
        working-directory: frontend
        run: >-
          npx vitest run
          src/coverageGaps.test.tsx
          src/components/modals/ModalCoverage.test.tsx
          src/App.prismaExport.test.tsx
          src/App.pollingBranches.test.tsx
          src/snapshotPolling.test.ts
          src/App.coverage.test.tsx

      - name: Verify typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Verify complete coverage
        working-directory: frontend
        run: npm run coverage

      - name: Verify production build
        working-directory: frontend
        run: npm run build

      - name: Commit verified repair and remove temporary automation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch \
            .github/pr-693-repair.py \
            .github/pr-693-workflow-probe.txt \
            .github/repair-pr-693-review-v2.trigger \
            .github/workflows/pr-693-address-review.yml \
            .github/workflows/pr-693-probe.yml \
            .github/workflows/pr-693-unblock-repair.yml \
            .github/workflows/repair-pr-693-review-v2.yml
          git add frontend/src
          git diff --cached --check
          git commit -m 'fix(frontend): close current-head review gaps'
          git push origin HEAD:bolt-react-flow-cache-5569281215077212328
