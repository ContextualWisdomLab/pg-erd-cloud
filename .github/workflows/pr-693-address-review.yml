          Path("frontend/src/snapshotPolling.test.ts").write_text(
              '''import { afterEach, describe, expect, it, vi } from "vitest";
import type { Snapshot, SnapshotDetail } from "./types";
import { startSnapshotPolling } from "./snapshotPolling";

const runningSnapshot: SnapshotDetail = {
  schema_snapshot_uuid: "snapshot-one",
  status: "running",
  schema_filter: "public",
  error_message: null,
  snapshot_json: null,
};
const terminalSnapshot: SnapshotDetail = {
  ...runningSnapshot,
  status: "succeeded",
};
const summary: Snapshot = {
  schema_snapshot_uuid: "snapshot-one",
  status: "succeeded",
  schema_filter: "public",
};

async function flushPromises(): Promise<void> {
  await Promise.resolve();
  await Promise.resolve();
  await Promise.resolve();
}

function callbacks() {
  return {
    onSnapshot: vi.fn(),
    onSnapshots: vi.fn(),
    onError: vi.fn(),
  };
}

afterEach(() => {
  vi.useRealTimers();
});

describe("startSnapshotPolling", () => {
  it("schedules the next request only after the current non-terminal request settles", async () => {
    let resolveSnapshot!: (snapshot: SnapshotDetail) => void;
    const getSnapshot = vi.fn(() => new Promise<SnapshotDetail>((resolve) => {
      resolveSnapshot = resolve;
    }));
    const schedule = vi.fn(() => 17);
    const cancelSchedule = vi.fn();
    const sinks = callbacks();
    const stop = startSnapshotPolling({
      snapshotId: "snapshot-one",
      projectId: "project-one",
      getSnapshot,
      listSnapshots: vi.fn(),
      schedule,
      cancelSchedule,
      intervalMs: 25,
      ...sinks,
    });

    expect(getSnapshot).toHaveBeenCalledTimes(1);
    expect(schedule).not.toHaveBeenCalled();
    resolveSnapshot(runningSnapshot);
    await flushPromises();

    expect(sinks.onSnapshot).toHaveBeenCalledWith(runningSnapshot);
    expect(schedule).toHaveBeenCalledWith(expect.any(Function), 25);
    stop();
    stop();
    expect(cancelSchedule).toHaveBeenCalledWith(17);
    expect(cancelSchedule).toHaveBeenCalledTimes(1);
  });

  it("suppresses an in-flight snapshot success after cleanup", async () => {
    let resolveSnapshot!: (snapshot: SnapshotDetail) => void;
    const sinks = callbacks();
    const stop = startSnapshotPolling({
      snapshotId: "snapshot-one",
      projectId: "project-one",
      getSnapshot: () => new Promise((resolve) => { resolveSnapshot = resolve; }),
      listSnapshots: vi.fn(),
      schedule: vi.fn(() => 1),
      cancelSchedule: vi.fn(),
      ...sinks,
    });

    stop();
    resolveSnapshot(runningSnapshot);
    await flushPromises();
    expect(sinks.onSnapshot).not.toHaveBeenCalled();
    expect(sinks.onSnapshots).not.toHaveBeenCalled();
    expect(sinks.onError).not.toHaveBeenCalled();
  });

  it("suppresses an in-flight snapshot failure after cleanup", async () => {
    let rejectSnapshot!: (reason: Error) => void;
    const sinks = callbacks();
    const stop = startSnapshotPolling({
      snapshotId: "snapshot-one",
      projectId: "project-one",
      getSnapshot: () => new Promise((_, reject) => { rejectSnapshot = reject; }),
      listSnapshots: vi.fn(),
      schedule: vi.fn(() => 1),
      cancelSchedule: vi.fn(),
      ...sinks,
    });

    stop();
    rejectSnapshot(new Error("stale snapshot failure"));
    await flushPromises();
    expect(sinks.onError).not.toHaveBeenCalled();
  });

  it("suppresses a terminal list success after cleanup", async () => {
    let resolveList!: (snapshots: Snapshot[]) => void;
