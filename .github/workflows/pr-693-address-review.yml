          Path("frontend/src/snapshotPolling.ts").write_text(
              '''import type { Snapshot, SnapshotDetail } from "./types";

/** Snapshot states that stop polling and optionally refresh the project list. */
export const TERMINAL_SNAPSHOT_STATUSES = new Set([
  "succeeded",
  "failed",
  "not_found",
]);

/** Dependencies and state sinks required by the sequential snapshot poller. */
export type SnapshotPollingOptions = {
  snapshotId: string;
  projectId: string | null;
  getSnapshot: (snapshotId: string) => Promise<SnapshotDetail>;
  listSnapshots: (projectId: string) => Promise<Snapshot[]>;
  onSnapshot: (snapshot: SnapshotDetail) => void;
  onSnapshots: (snapshots: Snapshot[]) => void;
  onError: (message: string) => void;
  intervalMs?: number;
  schedule?: (callback: () => void, delay: number) => number;
  cancelSchedule?: (timer: number) => void;
};

/**
 * Start one-at-a-time snapshot polling and return an idempotent cleanup function.
 *
 * A new request is scheduled only after the previous request settles. Cleanup
 * invalidates in-flight snapshot and list responses before they reach React state.
 */
export function startSnapshotPolling(options: SnapshotPollingOptions): () => void {
  const schedule =
    options.schedule ?? ((callback, delay) => window.setTimeout(callback, delay));
  const cancelSchedule =
    options.cancelSchedule ?? ((timer) => window.clearTimeout(timer));
  const intervalMs = options.intervalMs ?? 1000;
  let active = true;
  let timer: number | null = null;

  function scheduleNext(): void {
    if (!active) return;
    timer = schedule(() => {
      timer = null;
      void poll();
    }, intervalMs);
  }

  async function poll(): Promise<void> {
    try {
      const snapshot = await options.getSnapshot(options.snapshotId);
      if (!active) return;
      options.onSnapshot(snapshot);

      if (TERMINAL_SNAPSHOT_STATUSES.has(snapshot.status)) {
        if (options.projectId) {
          try {
            const snapshots = await options.listSnapshots(options.projectId);
            if (active) options.onSnapshots(snapshots);
          } catch (error) {
            if (active) options.onError(String(error));
          }
        }
        return;
      }
    } catch (error) {
      if (!active) return;
      options.onError(String(error));
    }
    scheduleNext();
  }

  void poll();

  return () => {
    if (!active) return;
    active = false;
    if (timer !== null) {
      cancelSchedule(timer);
      timer = null;
    }
  };
}
''',
