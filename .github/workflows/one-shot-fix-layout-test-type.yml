name: one-shot fix layout test type

on:
  push:
    branches: ["feat/relationship-aware-auto-layout"]
    paths:
      - ".github/workflows/one-shot-fix-layout-test-type.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-fix-layout-test-type-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/relationship-aware-auto-layout
          fetch-depth: 0

      - name: Narrow the minimal fixture to the supported structural contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/erd/dagreLayout.test.ts")
          text = path.read_text(encoding="utf-8")
          old = 'const minimal: Node<{ columns?: readonly unknown[] }> = {'
          new = 'const minimal: Node<{ columns?: readonly { column_comment?: string | null; example_value?: unknown }[] }> = {'
          if text.count(old) != 1:
              raise SystemExit("minimal fixture type marker changed")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install and verify frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify:layout-license
          npm run typecheck
          npm run test
          npm run coverage
          npm run build

      - name: Remove workflow and publish verified fixture fix
        env:
          BRANCH_NAME: feat/relationship-aware-auto-layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-fix-layout-test-type.yml
          git add frontend/src/erd/dagreLayout.test.ts
          git diff --cached --check
          git commit -m "test(frontend): type minimal layout fixture structurally"
          git push origin "HEAD:${BRANCH_NAME}"
