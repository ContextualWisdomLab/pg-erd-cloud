name: repair-pr-696-v2

on:
  push:
    branches:
      - palette-form-submission-2191064457221307953
    paths:
      - .github/repair-pr-696-v2.trigger

permissions:
  contents: read

concurrency:
  group: repair-pr-696-v2
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout pull request branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: palette-form-submission-2191064457221307953
          fetch-depth: 0
          persist-credentials: true

      - name: Restore canonical frontend dependency baseline
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout origin/main -- frontend/package.json frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.10'

      - name: Apply current review fixes
        run: python scripts/ci/repair_pr_696_v2.py

      - name: Validate patch
        run: git diff --check

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Complete frontend coverage suite
        working-directory: frontend
        run: npm run test

      - name: Production frontend build
        working-directory: frontend
        run: npm run build

      - name: Publish validated repair
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/repair-pr-696-v2.yml \
            .github/repair-pr-696-v2.trigger \
            scripts/ci/repair_pr_696_v2.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'test(frontend): prove native form submission contracts'
          git push origin HEAD:palette-form-submission-2191064457221307953
