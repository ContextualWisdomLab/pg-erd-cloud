name: Cleanup PR 716 Artifacts

on:
  push:
    branches:
      - jules-3578797244930525994-2c5c0eb4

permissions:
  contents: write

concurrency:
  group: cleanup-pr-716-artifacts
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.head_commit.message == 'chore: clean PR 716 artifacts'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: jules-3578797244930525994-2c5c0eb4
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Remove planning artifacts
        shell: bash
        run: |
          set -euo pipefail
          git rm -f fix_plan*.txt
          git rm .github/workflows/cleanup-pr-716-artifacts.yml

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run coverage
          npm run build

      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove PR planning artifacts'
          git pull --rebase origin jules-3578797244930525994-2c5c0eb4
          git push origin 'HEAD:jules-3578797244930525994-2c5c0eb4'
