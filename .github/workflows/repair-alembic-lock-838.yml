name: repair Alembic lock for PR 838

on:
  push:
    branches:
      - dependabot/pip/backend/alembic-gte-1.19.0

permissions:
  contents: read

concurrency:
  group: repair-alembic-lock-838
  cancel-in-progress: false

jobs:
  repair:
    permissions:
      contents: write
    if: >-
      github.repository == 'ContextualWisdomLab/pg-erd-cloud' &&
      github.ref == 'refs/heads/dependabot/pip/backend/alembic-gte-1.19.0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgerd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pgerd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TARGET_BRANCH: dependabot/pip/backend/alembic-gte-1.19.0
      GITHUB_TOKEN: ${{ github.token }}
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/pgerd
      APP_SECRET: 0123456789abcdef0123456789abcdef
      AUTH_MODE: dev
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout exact repair trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify single-writer handoff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
          enable-cache: false

      - name: Regenerate both owned hash locks
        shell: bash
        run: |
          set -euo pipefail
          uv pip compile backend/pyproject.toml \
            --python-version 3.10 \
            --generate-hashes \
            --upgrade-package alembic \
            -o backend/requirements.lock
          uv pip compile backend/pyproject.toml \
            --python-version 3.10 \
            --generate-hashes \
            --extra dev \
            --upgrade-package alembic \
            -o backend/requirements-dev.lock

      - name: Record buyer-visible migration dependency evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          marker = "## Unreleased\n"
          entry = (
              "- [BE] 🧭 **Alembic 1.19.1 migration evidence**: "
              "backend declarations and both hash-locked install paths now resolve to Alembic 1.19.1; "
              "a clean PostgreSQL 18 migration, downgrade/upgrade recovery, and autogenerate drift check "
              "protect the executable schema contract.\n"
          )
          if entry not in text:
              if marker not in text:
                  raise SystemExit("Unreleased changelog section is missing")
              path.write_text(text.replace(marker, marker + entry, 1), encoding="utf-8")
          PY

      - name: Verify resolved and installed dependency set
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          expected = {"alembic": "1.19.1", "cryptography": "50.0.0"}
          for filename in ("backend/requirements.lock", "backend/requirements-dev.lock"):
              text = Path(filename).read_text(encoding="utf-8")
              for package, version in expected.items():
                  match = re.search(rf"(?m)^{package}==([^ \\]+) \\$", text)
                  if match is None or match.group(1) != version:
                      raise SystemExit(
                          f"{filename} resolved {package} to "
                          f"{None if match is None else match.group(1)}, expected {version}"
                      )
          PY
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version

          expected = {"alembic": "1.19.1", "cryptography": "50.0.0"}
          for package, wanted in expected.items():
              installed = version(package)
              if installed != wanted:
                  raise SystemExit(f"installed {package} {installed}, expected {wanted}")
          PY

      - name: Exercise real PostgreSQL migration and recovery
        shell: bash
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          alembic heads
          alembic upgrade head
          alembic current --check-heads
          alembic check
          current_before="$(alembic current | sed -n '1p')"
          test -n "$current_before"
          alembic downgrade -1
          current_after_downgrade="$(alembic current | sed -n '1p')"
          test "$current_after_downgrade" != "$current_before"
          alembic upgrade head
          alembic current --check-heads
          alembic check
          psql "postgresql://postgres:postgres@127.0.0.1:5432/pgerd" \
            -v ON_ERROR_STOP=1 -Atc \
            "SELECT count(*) = 1 FROM alembic_version;" | grep -Fx true

      - name: Run focused and complete backend verification
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          mapfile -t focused_tests < <(
            grep -rIlE 'alembic|migration|upgrade|downgrade|autogenerate|check constraint' tests \
              --include='test_*.py' | sort -u
          )
          if ((${#focused_tests[@]} > 0)); then
            PYTHONPATH=. pytest -q "${focused_tests[@]}"
          fi
          PYTHONPATH=. mypy app
          PYTHONPATH=. pytest -q
          python -m compileall -q app alembic

      - name: Bound the generated diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(CHANGELOG\.md|backend/requirements(-dev)?\.lock)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected generated paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          test -n "$changed"

      - name: Commit verified locks and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          remote_head="$(
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" \
              ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}'
          )"
          test "$remote_head" = "$GITHUB_SHA"

          git rm .github/workflows/repair-alembic-lock-838.yml
          git add CHANGELOG.md backend/requirements.lock backend/requirements-dev.lock

          staged="$(git diff --cached --name-only | sort)"
          unexpected="$(
            printf '%s\n' "$staged" |
              grep -Ev '^(\.github/workflows/repair-alembic-lock-838\.yml|CHANGELOG\.md|backend/requirements(-dev)?\.lock)$' || true
          )"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected staged paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          test -n "$staged"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): align Alembic migration locks"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" \
            push origin "HEAD:refs/heads/$TARGET_BRANCH"
