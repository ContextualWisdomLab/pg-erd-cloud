name: Generate and Commit Backend Locks

on:
  pull_request:
    branches:
      - main
    paths:
      - backend/pyproject.toml
      - .github/workflows/generate-backend-locks-artifact.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout maintained branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: automation/synchronize-backend-locks
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.10'

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.14'
          enable-cache: false

      - name: Generate hash-locked environments
        run: |
          set -euo pipefail
          uv pip compile backend/pyproject.toml --python-version 3.10 --generate-hashes -o backend/requirements.lock
          uv pip compile backend/pyproject.toml --python-version 3.10 --generate-hashes --extra dev -o backend/requirements-dev.lock
          grep -Eq '^fastapi==0\.(14[1-9]|1[5-9][0-9]|[2-9][0-9]{2})\.' backend/requirements.lock
          grep -Eq '^fastapi==0\.(14[1-9]|1[5-9][0-9]|[2-9][0-9]{2})\.' backend/requirements-dev.lock
          grep -Eq '^redis==([89]|[1-9][0-9]+)\.' backend/requirements.lock
          grep -Eq '^redis==([89]|[1-9][0-9]+)\.' backend/requirements-dev.lock

      - name: Validate generated locks
        working-directory: backend
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          PYTHONPATH=. mypy app
          PYTHONPATH=. pytest -q

      - name: Commit verified lockfiles and remove one-shot artifacts
        run: |
          set -euo pipefail
          git rm .github/repair-pr-706.trigger
          git rm .github/workflows/repair-pr-706-locks.yml
          git rm .github/workflows/autofix-pr-706-locks.yml
          git rm .github/workflows/generate-backend-locks-artifact.yml
          git add backend/requirements.lock backend/requirements-dev.lock
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(deps): synchronize FastAPI and Redis lockfiles'
          git pull --rebase origin automation/synchronize-backend-locks
          git push origin 'HEAD:automation/synchronize-backend-locks'
