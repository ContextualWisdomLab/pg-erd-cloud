name: Repair PR 745 focused DSN redaction

on:
  push:
    branches:
      - sentinel/dsn-redaction-fix-14431549202957900548
    paths:
      - .github/workflows/repair-pr745-focused-dsn-redaction.yml

permissions:
  contents: read

concurrency:
  group: repair-pr745-focused-dsn-redaction-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair-and-verify:
    if: >-
      github.repository == 'ContextualWisdomLab/pg-erd-cloud'
      && github.ref == 'refs/heads/sentinel/dsn-redaction-fix-14431549202957900548'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact repair trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Restore canonical dependency boundary and write focused implementation
        env:
          BASE_SHA: 72afe6db712b145baaba084f64a1ff4fb36d9fd0
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          for path in \
            backend/pyproject.toml \
            backend/requirements-dev.lock \
            backend/requirements.lock \
            backend/uv.lock \
            .jules/sentinel.md
          do
            if git cat-file -e "${BASE_SHA}:${path}" 2>/dev/null; then
              mkdir -p "$(dirname "$path")"
              git show "${BASE_SHA}:${path}" >"$path"
            else
              rm -f "$path"
            fi
          done

          cat >backend/app/dsn_redaction.py <<'PY'
          """Fail-closed database DSN secret redaction for bounded diagnostics."""

          from __future__ import annotations

          import re
          from urllib.parse import quote, quote_plus, unquote, unquote_plus, urlsplit

          _SECRET_KEY_PATTERN = re.compile(
              r"(?:pass(?:word|wd)?|pwd|token|secret|private[_-]?key|api[_-]?key|"
              r"access[_-]?key|auth(?:entication)?)",
              re.IGNORECASE,
          )
          _SECRET_ASSIGNMENT_PATTERN = re.compile(
              r"(?P<prefix>\b[\w.-]*(?:pass(?:word|wd)?|pwd|token|secret|private[_-]?key|"
              r"api[_-]?key|access[_-]?key|auth(?:entication)?)[\w.-]*\s*[:=]\s*)"
              r"(?P<value>[^&\s,;\"'<>]+)",
              re.IGNORECASE,
          )


          def _split_dsn_best_effort(dsn: str) -> tuple[str, str]:
              """Return authority and query text when strict URL splitting fails.

              The fallback performs only bounded string slicing. It exists because
              malformed authorities such as an unbalanced IPv6 bracket can make
              :func:`urllib.parse.urlsplit` raise before embedded credentials are
              available for redaction.
              """

              remainder = dsn
              scheme_separator = remainder.find("://")
              if scheme_separator != -1:
                  remainder = remainder[scheme_separator + 3 :]
              remainder = remainder.split("#", 1)[0]
              if "?" in remainder:
                  remainder, query = remainder.split("?", 1)
              else:
                  query = ""
              authority = remainder.split("/", 1)[0]
              return authority, query


          def _password_candidates_from_dsn(dsn: str) -> set[str]:
              """Return exact secret spellings that a database driver may expose.

              URL user-information uses :func:`urllib.parse.unquote`, preserving a
              literal plus sign. Query values use form decoding through
              :func:`urllib.parse.unquote_plus`. Raw, decoded, and canonical encoded
              spellings are retained so driver-specific rendering remains covered.
              """

              candidates: set[str] = set()
              password: str | None = None
              try:
                  parsed = urlsplit(dsn)
                  if "://" in dsn and not parsed.netloc:
                      parsed = urlsplit("http://" + dsn.split("://", 1)[1])
                  authority = parsed.netloc
                  password = parsed.password
                  query = parsed.query
              except ValueError:
                  authority, query = _split_dsn_best_effort(dsn)

              if password:
                  decoded_password = unquote(password)
                  candidates.update(
                      {password, decoded_password, quote(decoded_password, safe="")}
                  )

              if "@" in authority:
                  user_information = authority.rsplit("@", 1)[0]
                  if ":" in user_information:
                      raw_password = user_information.split(":", 1)[1]
                      decoded_password = unquote(raw_password)
                      candidates.update(
                          {
                              raw_password,
                              decoded_password,
                              quote(decoded_password, safe=""),
                          }
                      )

              for query_part in query.split("&"):
                  key, separator, raw_value = query_part.partition("=")
                  if not separator:
                      continue
                  if not _SECRET_KEY_PATTERN.search(unquote_plus(key)):
                      continue
                  decoded_value = unquote_plus(raw_value)
                  candidates.update(
                      {
                          raw_value,
                          decoded_value,
                          quote(decoded_value, safe=""),
                          quote_plus(decoded_value, safe=""),
                      }
                  )

              return {candidate for candidate in candidates if candidate}


          def _redact_secret_occurrences(message: str, secret: str) -> str:
              """Replace one case-sensitive secret without corrupting larger words."""

              if not secret:
                  return message
              if len(secret) > 4:
                  return message.replace(secret, "***")
              pattern = re.compile(rf"(?<!\w){re.escape(secret)}(?!\w)")
              return pattern.sub("***", message)


          def redact_dsn_error_message(error_message: str, dsn: str) -> str:
              """Return a driver message with DSN-derived credentials removed.

              Candidate replacement runs longest first and is deliberately
              case-sensitive because passwords and tokens are case-sensitive. A final
              assignment-shaped sanitizer removes values whose sensitive key names are
              visible even when malformed DSN syntax prevents candidate extraction.
              """

              redacted = error_message
              for secret in sorted(
                  _password_candidates_from_dsn(dsn), key=len, reverse=True
              ):
                  redacted = _redact_secret_occurrences(redacted, secret)
              return _SECRET_ASSIGNMENT_PATTERN.sub(r"\g<prefix>***", redacted)
          PY

          cat >backend/tests/test_dsn_redaction.py <<'PY'
          """Behavioral regressions for fail-closed DSN secret redaction."""

          from app.dsn_redaction import (
              _password_candidates_from_dsn,
              _redact_secret_occurrences,
              _split_dsn_best_effort,
              redact_dsn_error_message,
          )


          def test_redacts_nonstandard_scheme_password_and_query_secret() -> None:
              """Non-RFC schemes retain user-information and query redaction."""

              dsn = "snowflake_invalid://user:pa%3Ass@acct.example.com/db?token=q%2Fsecret"
              error = (
                  "driver failed for pa:ss using "
                  "snowflake_invalid://user:pa%3Ass@acct.example.com/db?token=q%2Fsecret "
                  "with token=q/secret"
              )
              redacted = redact_dsn_error_message(error, dsn)
              assert "pa:ss" not in redacted
              assert "pa%3Ass" not in redacted
              assert "q/secret" not in redacted
              assert "q%2Fsecret" not in redacted
              assert "snowflake_invalid://user:***@acct.example.com/db?token=***" in redacted


          def test_short_dsn_password_does_not_corrupt_secret_key_names() -> None:
              """A short credential is removed without altering larger identifiers."""

              dsn = "postgresql://user:pass@db.example.com/app?password=q%2Fsecret"
              error = (
                  "driver failed with password=q/secret while retrying "
                  "postgresql://user:pass@db.example.com/app"
              )
              redacted = redact_dsn_error_message(error, dsn)
              assert "q/secret" not in redacted
              assert "user:pass@" not in redacted
              assert "password=***" in redacted
              assert "postgresql://user:***@db.example.com/app" in redacted
              assert "***word" not in redacted


          def test_malformed_dsn_still_redacts_embedded_secrets() -> None:
              """Malformed IPv6 authority text uses the bounded fallback parser."""

              dsn = "postgresql://user:s3cr3t@[bad/db?password=q%2Fsecret"
              error = f"driver failed for s3cr3t with password=q/secret while using {dsn}"
              redacted = redact_dsn_error_message(error, dsn)
              assert "s3cr3t" not in redacted
              assert "q/secret" not in redacted
              assert "password=***" in redacted


          def test_literal_plus_in_user_information_is_not_decoded_as_space() -> None:
              """Authority decoding preserves a literal plus and unrelated spaces."""

              dsn = "postgresql://user:a+b@db.example.com/app"
              error = "driver exposed a+b, but the unrelated phrase a b must remain"
              redacted = redact_dsn_error_message(error, dsn)
              assert "a+b" not in redacted
              assert "unrelated phrase a b must remain" in redacted


          def test_form_query_plus_decodes_to_space() -> None:
              """Query form encoding covers raw plus and decoded-space renderings."""

              dsn = "postgresql://user:long-secret@db.example.com/app?token=a+b"
              error = "driver exposed token=a+b and decoded value a b"
              redacted = redact_dsn_error_message(error, dsn)
              assert "token=***" in redacted
              assert "decoded value ***" in redacted


          def test_short_unicode_secret_uses_unicode_word_boundaries() -> None:
              """Unicode identifiers containing a short secret remain intact."""

              dsn = "postgresql://user@db.example.com/app?token=키"
              error = "token=키 must be hidden while 비밀키값 remains readable"
              redacted = redact_dsn_error_message(error, dsn)
              assert "token=***" in redacted
              assert "비밀키값 remains readable" in redacted


          def test_short_punctuation_secret_requires_complete_boundaries() -> None:
              """Punctuation credentials redact standalone occurrences, not substrings."""

              dsn = "postgresql://user:+a+@db.example.com/app"
              error = "isolated +a+ must be hidden while x+a+y remains readable"
              redacted = redact_dsn_error_message(error, dsn)
              assert "isolated *** must be hidden" in redacted
              assert "x+a+y remains readable" in redacted


          def test_secret_matching_is_case_sensitive() -> None:
              """Credential case is preserved while assignment values still fail closed."""

              dsn = "postgresql://user:SECRET@db.example.com/app?token=KeY"
              error = "exact SECRET and KeY; unrelated secret and key; token=key"
              redacted = redact_dsn_error_message(error, dsn)
              assert "exact *** and ***" in redacted
              assert "unrelated secret and key" in redacted
              assert "token=***" in redacted


          def test_fallback_split_handles_no_scheme_query_or_fragment() -> None:
              """The fallback covers its no-scheme and no-query branches deterministically."""

              assert _split_dsn_best_effort("user:secret@host/path#fragment") == (
                  "user:secret@host",
                  "",
              )
              assert _split_dsn_best_effort("user:secret@host/path?token=value#fragment") == (
                  "user:secret@host",
                  "token=value",
              )


          def test_candidate_parser_ignores_flags_and_empty_values() -> None:
              """Nonassignments and empty secret values cannot create candidates."""

              candidates = _password_candidates_from_dsn(
                  "postgresql://host/app?flag&ordinary=value&token="
              )
              assert candidates == set()


          def test_empty_secret_replacement_is_a_noop() -> None:
              """The internal replacement helper is total for an empty candidate."""

              assert _redact_secret_occurrences("stable", "") == "stable"
          PY

          mkdir -p docs/doctoring
          cat >docs/doctoring/dsn-secret-redaction.md <<'MD'
          # DSN secret-redaction boundary

          ## Decision

          Database-driver errors are sanitized before they cross an API or diagnostic boundary. User-information passwords and query values are distinct encoding domains: authority values use `urllib.parse.unquote`, preserving literal plus signs, while query values use `urllib.parse.unquote_plus` because form encoding maps plus to space.

          The sanitizer derives raw, decoded, and canonical encoded candidates, replaces longer candidates exactly, and applies Unicode word boundaries to short credentials. Matching is case-sensitive because credentials are case-sensitive. A final key-assignment pattern fails closed when malformed DSN syntax prevents complete parsing.

          Malformed authorities are handled through bounded string slicing rather than returning the original error or raising. The output remains diagnostic text, not a safe shell command or HTML fragment.

          ## Verification

          Tests cover nonstandard schemes, malformed IPv6 authorities, percent encoding, literal authority plus signs, query form plus signs, Unicode identifiers, punctuation-bearing short credentials, case sensitivity, assignment fallback, and parser edge branches. Complete backend pytest and mypy remain authoritative.

          ## References

          Open Worldwide Application Security Project. (n.d.). *Logging cheat sheet*. OWASP Foundation. https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html

          Python Software Foundation. (2026). *urllib.parse—Parse URLs into components*. https://docs.python.org/3/library/urllib.parse.html
          MD

          python - <<'PY'
          from pathlib import Path

          changelog = Path("CHANGELOG.md")
          source = changelog.read_text(encoding="utf-8")
          entry = (
              "- [BE] 🔒 **DSN 오류 비밀정보 redaction 정합화**: authority와 form query의 "
              "디코딩 규칙을 분리하고, case-sensitive exact candidate와 Unicode short-secret "
              "boundary를 적용하며, malformed DSN·literal plus·국제화 식별자 회귀를 추가했습니다.\n"
          )
          if entry not in source:
              marker = "## Unreleased\n"
              if marker not in source:
                  raise SystemExit("CHANGELOG.md is missing the Unreleased heading")
              source = source.replace(marker, marker + entry, 1)
              changelog.write_text(source, encoding="utf-8")
          Path(".github/workflows/repair-pr745-focused-dsn-redaction.yml").unlink()
          PY
          git diff --check

      - name: Install exact backend environment
        working-directory: backend
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock

      - name: Verify complete backend behavior and typing
        working-directory: backend
        env:
          PYTHONPATH: .
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          mypy app
          pytest -q
          python -m compileall -q app tests
          git diff --check

      - name: Publish verified focused repair
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          HEAD_BRANCH: ${{ github.ref_name }}
          PUSH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          remote_head="$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && { echo "No focused repair generated" >&2; exit 1; }
          git commit -m "fix(security): restore focused DSN redaction boundary"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push --force-with-lease="refs/heads/${HEAD_BRANCH}:${EXPECTED_HEAD}" \
            origin "HEAD:refs/heads/${HEAD_BRANCH}"
