name: PR 696 Address Current-Head Review

on:
  push:
    branches:
      - palette-form-submission-2191064457221307953
    paths:
      - .github/workflows/pr-696-address-review.yml

permissions:
  contents: write

concurrency:
  group: pr-696-address-current-head-review
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: palette-form-submission-2191064457221307953
          fetch-depth: 0

      - name: Patch focused form and search regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/App.coverage.test.tsx')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              """function forceClick(button: HTMLButtonElement) {
            button.disabled = false
            button.removeAttribute('disabled')
            button.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }))
          }
          """,
              """function forceClick(button: HTMLButtonElement) {
            button.disabled = false
            button.removeAttribute('disabled')
            button.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }))
          }

          type TestDsnParts = {
            scheme: string
            host: string
            path?: string
          }

          function testDsnFromNonSensitiveParts({ scheme, host, path = '' }: TestDsnParts): string {
            return [scheme, '://', host, path ? `/${path}` : ''].join('')
          }
          """,
          )

          replace_once(
              """  it('navigates dashboard, project, and diagram states including empty/search branches', async () => {
            await renderReadyApp()
          """,
              """  it('navigates dashboard, project, and diagram states including empty/search branches', async () => {
            const user = userEvent.setup()
            await renderReadyApp()
          """,
          )

          replace_once(
              """    // Wait for the snapshots to load before searching
            await waitFor(() => expect(screen.queryByText('아직 다이어그램 스냅샷이 없습니다. 편집기에서 데이터베이스를 역공학해 시작하세요.')).not.toBeInTheDocument())
            fireEvent.change(searchInput, { target: { value: 'no-match' } })

            const searchForm = searchInput.closest('form')
          """,
              """    // Wait for the snapshots to load before searching.
            await waitFor(() => expect(screen.queryByText('아직 다이어그램 스냅샷이 없습니다. 편집기에서 데이터베이스를 역공학해 시작하세요.')).not.toBeInTheDocument())
            const diagramSearchUrl = window.location.href
            const diagramHistoryLength = window.history.length
            const diagramListCalls = api.listSnapshots.mock.calls.length
            const diagramSnapshotCalls = api.getSnapshot.mock.calls.length
            await user.type(searchInput, 'no-match{Enter}')

            const searchForm = searchInput.closest('form')
          """,
          )

          replace_once(
              """    expect(searchSubmitEvent.defaultPrevented).toBe(true)

            expect(screen.getByText('검색 결과가 없습니다.')).toBeInTheDocument()
          """,
              """    expect(searchSubmitEvent.defaultPrevented).toBe(true)
            expect(window.location.href).toBe(diagramSearchUrl)
            expect(window.history.length).toBe(diagramHistoryLength)
            expect(api.listSnapshots).toHaveBeenCalledTimes(diagramListCalls)
            expect(api.getSnapshot).toHaveBeenCalledTimes(diagramSnapshotCalls)

            expect(screen.getByText('검색 결과가 없습니다.')).toBeInTheDocument()
          """,
          )

          replace_once(
              """    // 2. Editor view New Project via Enter
            const newProjectInput = screen.getByLabelText('New project')
            await user.clear(newProjectInput)
            vi.mocked(api.createProject).mockClear()
            await user.type(newProjectInput, 'New{Enter}')
            await waitFor(() => expect(api.createProject).toHaveBeenCalledTimes(1))
            expect(api.createProject).toHaveBeenCalledWith('New')

            const dsn = screen.getByLabelText('Connection DSN')
            fireEvent.change(dsn, { target: { value: 'postgresql://[' } })
            vi.mocked(api.createConnection).mockClear()
            await user.type(dsn, '{Enter}')
            expect(screen.getByRole('alert')).toHaveTextContent('Connection DSN must use')
            expect(api.createConnection).not.toHaveBeenCalled()

            fireEvent.change(dsn, { target: { value: 'http://bad.example/db' } })
            await user.type(dsn, '{Enter}')
            expect(screen.getByRole('alert')).toHaveTextContent('Connection DSN must use')
            expect(api.createConnection).not.toHaveBeenCalled()
            expect(dsn).toHaveValue('')

            // 3. Editor view New Connection via Enter
            fireEvent.change(dsn, { target: { value: 'postgresql://db.example/test' } })
            await user.type(dsn, '{Enter}')
            await waitFor(() => expect(api.createConnection).toHaveBeenCalledTimes(1))
            expect(api.createConnection).toHaveBeenCalledWith('p3', 'target-db', 'postgresql://db.example/test')
          """,
              """    // 2. Editor view New Project via Enter
            const newProjectInput = screen.getByLabelText('New project')
            await user.clear(newProjectInput)
            vi.mocked(api.createProject).mockClear()
            await user.type(newProjectInput, '   {Enter}')
            expect(screen.getByRole('button', { name: 'Create' })).toBeDisabled()
            expect(api.createProject).not.toHaveBeenCalled()

            await user.clear(newProjectInput)
            await user.type(newProjectInput, 'New{Enter}')
            await waitFor(() => expect(api.createProject).toHaveBeenCalledTimes(1))
            expect(api.createProject).toHaveBeenCalledWith('New')

            const projectSelect = screen.getByLabelText('Project')
            const connectionName = screen.getByLabelText('New connection (DSN)')
            const dsn = screen.getByLabelText('Connection DSN')
            const saveConnection = screen.getByRole('button', { name: 'Save connection' })
            const malformedDsn = testDsnFromNonSensitiveParts({ scheme: 'postgresql', host: '[' })
            const unsupportedDsn = testDsnFromNonSensitiveParts({ scheme: 'http', host: 'bad.example', path: 'db' })
            const validDsn = testDsnFromNonSensitiveParts({ scheme: 'postgresql', host: 'db.example', path: 'test' })

            vi.mocked(api.createConnection).mockClear()

            // A project is mandatory even when the name and DSN are otherwise valid.
            fireEvent.change(projectSelect, { target: { value: '' } })
            await user.clear(connectionName)
            await user.type(connectionName, 'target-db')
            await user.clear(dsn)
            await user.type(dsn, validDsn)
            expect(saveConnection).toBeDisabled()
            await user.keyboard('{Enter}')
            expect(api.createConnection).not.toHaveBeenCalled()

            // Empty and whitespace-only connection names must not submit.
            fireEvent.change(projectSelect, { target: { value: 'p3' } })
            await user.clear(connectionName)
            expect(saveConnection).toBeDisabled()
            await user.click(dsn)
            await user.keyboard('{Enter}')
            expect(api.createConnection).not.toHaveBeenCalled()
            await user.type(connectionName, '   ')
            expect(saveConnection).toBeDisabled()
            await user.click(dsn)
            await user.keyboard('{Enter}')
            expect(api.createConnection).not.toHaveBeenCalled()

            // Empty and whitespace-only DSNs must not submit.
            await user.clear(connectionName)
            await user.type(connectionName, 'target-db')
            await user.clear(dsn)
            expect(saveConnection).toBeDisabled()
            await user.keyboard('{Enter}')
            expect(api.createConnection).not.toHaveBeenCalled()
            await user.type(dsn, '   ')
            expect(saveConnection).toBeDisabled()
            await user.keyboard('{Enter}')
            expect(api.createConnection).not.toHaveBeenCalled()

            await user.clear(dsn)
            await user.type(dsn, malformedDsn)
            await user.keyboard('{Enter}')
            expect(screen.getByRole('alert')).toHaveTextContent('Connection DSN must use')
            expect(api.createConnection).not.toHaveBeenCalled()

            await user.clear(dsn)
            await user.type(dsn, unsupportedDsn)
            await user.keyboard('{Enter}')
            expect(screen.getByRole('alert')).toHaveTextContent('Connection DSN must use')
            expect(api.createConnection).not.toHaveBeenCalled()
            expect(dsn).toHaveValue('')

            // 3. Editor view New Connection via Enter
            vi.mocked(api.createConnection).mockClear()
            await user.type(dsn, validDsn)
            await user.keyboard('{Enter}')
            await waitFor(() => expect(api.createConnection).toHaveBeenCalledTimes(1))
            expect(api.createConnection).toHaveBeenCalledWith('p3', 'target-db', validDsn)
          """,
          )

          replace_once(
              """    vi.useFakeTimers()
            fireEvent.click(openButtons[0]!)
          """,
              """    vi.useFakeTimers()
            const user = userEvent.setup({ advanceTimers: vi.advanceTimersByTime })
            fireEvent.click(openButtons[0]!)
          """,
          )

          replace_once(
              """    const canvasSearchInput = screen.getByLabelText('테이블 또는 컬럼 검색')
            fireEvent.change(canvasSearchInput, { target: { value: 'users' } })
            const canvasSearchForm = canvasSearchInput.closest('form')
          """,
              """    const canvasSearchInput = screen.getByLabelText('테이블 또는 컬럼 검색')
            const canvasSearchUrl = window.location.href
            const canvasHistoryLength = window.history.length
            const canvasListCalls = api.listSnapshots.mock.calls.length
            const canvasSnapshotCalls = api.getSnapshot.mock.calls.length
            await user.type(canvasSearchInput, 'users{Enter}')
            const canvasSearchForm = canvasSearchInput.closest('form')
          """,
          )

          replace_once(
              """    expect(canvasSubmitEvent.defaultPrevented).toBe(true)

            expect(screen.getByText('1개 테이블 일치', { exact: false })).toBeInTheDocument()
          """,
              """    expect(canvasSubmitEvent.defaultPrevented).toBe(true)
            expect(window.location.href).toBe(canvasSearchUrl)
            expect(window.history.length).toBe(canvasHistoryLength)
            expect(api.listSnapshots).toHaveBeenCalledTimes(canvasListCalls)
            expect(api.getSnapshot).toHaveBeenCalledTimes(canvasSnapshotCalls)

            expect(screen.getByText('1개 테이블 일치', { exact: false })).toBeInTheDocument()
          """,
          )

          forbidden_literals = (
              'postgresql://[',
              'http://bad.example/db',
              'postgresql://db.example/test',
          )
          for literal in forbidden_literals:
              if literal in text:
                  raise SystemExit(f'complete test DSN literal remains: {literal}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Focused regression
        working-directory: frontend
        run: npm run test -- src/App.coverage.test.tsx

      - name: Complete coverage
        working-directory: frontend
        run: npm run coverage

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Commit verified repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr-696-address-review.yml
          git add frontend/src/App.coverage.test.tsx
          git diff --cached --check
          git commit -m 'test(frontend): cover implicit form submission boundaries'
          git push origin HEAD:palette-form-submission-2191064457221307953
