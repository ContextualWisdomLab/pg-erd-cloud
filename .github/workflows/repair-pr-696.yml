name: repair-pr-696

on:
  push:
    branches:
      - palette-form-submission-2191064457221307953
    paths:
      - .github/repair-pr-696.trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout pull request branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: palette-form-submission-2191064457221307953
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply review fixes
        run: python scripts/ci/repair_pr_696.py

      - name: Validate patch
        run: git diff --check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Run complete frontend coverage suite
        working-directory: frontend
        run: npm run test

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Commit validated repair
        run: |
          set -euo pipefail
          git config user.name "pg-erd-cloud automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.coverage.test.tsx
          git diff --cached --quiet && exit 0
          git commit -m "test(frontend): cover implicit form submission contracts"
          git push origin HEAD:palette-form-submission-2191064457221307953
