name: Repair PR 696 final review tests

on:
  push:
    branches:
      - palette-form-submission-2191064457221307953
    paths:
      - .github/workflows/repair-pr-696-final.yml

concurrency:
  group: repair-pr-696-final-review-tests
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'ContextualWisdomLab/pg-erd-cloud' && github.actor == 'seonghobae'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Apply bounded review repair
        run: |
          set -euo pipefail
          python scripts/ci/repair_pr_696_final.py
          git diff --check
          test "$(git diff --name-only)" = "frontend/src/App.coverage.test.tsx"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exact dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Focused regression
        working-directory: frontend
        run: npm run test -- src/App.coverage.test.tsx

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Complete coverage
        working-directory: frontend
        run: npm run coverage

      - name: Production build
        working-directory: frontend
        run: npm run build

  publish:
    needs: verify
    if: github.repository == 'ContextualWisdomLab/pg-erd-cloud' && github.actor == 'seonghobae'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout exact verified head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reproduce, clean, and publish
        env:
          TARGET_BRANCH: palette-form-submission-2191064457221307953
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"

          python scripts/ci/repair_pr_696_final.py
          rm -f scripts/ci/repair_pr_696_final.py
          rm -f .github/workflows/repair-pr-696-final.yml
          git diff --check

          actual_files="$(git diff --name-only | sort)"
          expected_files="$(printf '%s\n' .github/workflows/repair-pr-696-final.yml frontend/src/App.coverage.test.tsx scripts/ci/repair_pr_696_final.py | sort)"
          test "$actual_files" = "$expected_files"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "test(frontend): prove native form submission contracts"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${GITHUB_SHA}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
