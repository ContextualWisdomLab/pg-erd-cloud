name: repair cryptography lock for PR 841

on:
  push:
    branches:
      - dependabot/pip/backend/cryptography-gte-50.0.0

permissions:
  contents: write

concurrency:
  group: repair-cryptography-lock-841
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/pg-erd-cloud' &&
      github.ref == 'refs/heads/dependabot/pip/backend/cryptography-gte-50.0.0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_PARENT_HEAD: bc13eaa530e8cf9687ab72bef23bb275257c369f
      TARGET_BRANCH: dependabot/pip/backend/cryptography-gte-50.0.0
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout exact repair trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify single-writer handoff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
          enable-cache: false

      - name: Regenerate both owned hash locks
        shell: bash
        run: |
          set -euo pipefail
          uv pip compile backend/pyproject.toml \
            --python-version 3.10 \
            --generate-hashes \
            --upgrade-package cryptography \
            -o backend/requirements.lock
          uv pip compile backend/pyproject.toml \
            --python-version 3.10 \
            --generate-hashes \
            --extra dev \
            --upgrade-package cryptography \
            -o backend/requirements-dev.lock

      - name: Record the security dependency correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          marker = "## Unreleased\n"
          entry = (
              "- [BE] 🔒 **Cryptography 50+ 보안 경계 갱신**: "
              "`pyproject.toml`과 두 hash-locked 요구사항 파일을 동일한 Cryptography 50+ 해석으로 "
              "정합화하여 PKCS#7 오류·타이밍 구분으로 인한 CVE-2026-69247 완화를 실제 설치·검증 경로에 반영했습니다.\n"
          )
          if entry not in text:
              if marker not in text:
                  raise SystemExit("Unreleased changelog section is missing")
              text = text.replace(marker, marker + entry, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Verify resolved and installed Cryptography versions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          resolved: dict[str, str] = {}
          for filename in ("backend/requirements.lock", "backend/requirements-dev.lock"):
              text = Path(filename).read_text(encoding="utf-8")
              match = re.search(r"(?m)^cryptography==([^ \\]+) \\$", text)
              if match is None:
                  raise SystemExit(f"{filename} does not pin cryptography")
              version = match.group(1)
              major = int(version.split(".", maxsplit=1)[0])
              if major < 50:
                  raise SystemExit(f"{filename} resolved unsupported cryptography {version}")
              resolved[filename] = version
          if len(set(resolved.values())) != 1:
              raise SystemExit(f"lockfiles disagree: {resolved}")
          print(f"resolved cryptography {next(iter(resolved.values()))}")
          PY
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m pip check
          python - <<'PY'
          import re
          from importlib.metadata import version
          from pathlib import Path

          lock_text = Path("backend/requirements-dev.lock").read_text(encoding="utf-8")
          match = re.search(r"(?m)^cryptography==([^ \\]+) \\$", lock_text)
          if match is None:
              raise SystemExit("development lock does not pin cryptography")
          locked = match.group(1)
          installed = version("cryptography")
          if installed != locked or int(installed.split(".", maxsplit=1)[0]) < 50:
              raise SystemExit(
                  f"installed cryptography {installed} does not match safe lock {locked}"
              )
          print(f"installed cryptography {installed}")
          PY

      - name: Run focused and complete backend verification
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          mapfile -t focused_tests < <(
            grep -rIlE 'cryptography|Fernet|JWT|jwt|encrypt|decrypt|sign|verify' tests \
              --include='test_*.py' | sort -u
          )
          if ((${#focused_tests[@]} > 0)); then
            PYTHONPATH=. pytest -q "${focused_tests[@]}"
          fi
          PYTHONPATH=. mypy app
          PYTHONPATH=. pytest -q
          python -m compileall -q app

      - name: Bound the generated diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(CHANGELOG\.md|backend/requirements(-dev)?\.lock)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected generated paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          test -n "$changed"

      - name: Commit verified locks and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          remote_head="$(
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" \
              ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}'
          )"
          test "$remote_head" = "$GITHUB_SHA"

          git rm .github/workflows/repair-cryptography-lock-841.yml
          git add CHANGELOG.md backend/requirements.lock backend/requirements-dev.lock

          staged="$(git diff --cached --name-only | sort)"
          unexpected="$(
            printf '%s\n' "$staged" |
              grep -Ev '^(\.github/workflows/repair-cryptography-lock-841\.yml|CHANGELOG\.md|backend/requirements(-dev)?\.lock)$' || true
          )"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected staged paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          test -n "$staged"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): align cryptography hash locks"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" \
            push origin "HEAD:refs/heads/$TARGET_BRANCH"
