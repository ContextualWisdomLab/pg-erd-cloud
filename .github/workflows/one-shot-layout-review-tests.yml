name: one-shot layout review contracts

on:
  push:
    branches: ["feat/relationship-aware-auto-layout"]
    paths:
      - ".github/workflows/one-shot-layout-review-tests.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-layout-review-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  add-review-contracts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/relationship-aware-auto-layout
          fetch-depth: 0

      - name: Add UI state and conservative geometry contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          app_test = Path("frontend/src/App.coverage.test.tsx")
          text = app_test.read_text(encoding="utf-8")

          marker = "vi.mock('./api', () => api)"
          insertion = '''const layout = vi.hoisted(() => ({
            requireDagreLayout: vi.fn(),
          }))

          vi.mock('./erd/dagreLayout', () => ({
            requireDagreLayout: layout.requireDagreLayout,
          }))

          '''
          if text.count(marker) != 1:
              raise SystemExit("App coverage mock marker changed")
          text = text.replace(marker, insertion + marker)

          old_flow = '''        <span data-testid="node-count">{props.nodes.length}</span>
                  <span data-testid="edge-count">{props.edges.length}</span>'''
          new_flow = '''        <span data-testid="node-count">{props.nodes.length}</span>
                  <span data-testid="node-positions">
                    {JSON.stringify(props.nodes.map((node: any) => ({ id: node.id, position: node.position })))}
                  </span>
                  <span data-testid="edge-count">{props.edges.length}</span>'''
          if text.count(old_flow) != 1:
              raise SystemExit("React Flow position marker changed")
          text = text.replace(old_flow, new_flow)

          old_before = '''beforeEach(() => {
            vi.clearAllMocks()
          '''
          new_before = '''beforeEach(() => {
            vi.clearAllMocks()
            layout.requireDagreLayout.mockImplementation((nodes: any[]) =>
              nodes.map((node, index) => ({
                ...node,
                position: { x: 1000 + index * 100, y: 2000 + index * 100 },
              })),
            )
          '''
          if text.count(old_before) != 1:
              raise SystemExit("beforeEach marker changed")
          text = text.replace(old_before, new_before)

          helper_marker = '''function forceClick(button: HTMLButtonElement) {'''
          helper = '''function readNodePositions() {
            return JSON.parse(screen.getByTestId('node-positions').textContent ?? '[]') as Array<{
              id: string
              position: { x: number; y: number }
            }>
          }

          '''
          if text.count(helper_marker) != 1:
              raise SystemExit("helper marker changed")
          text = text.replace(helper_marker, helper + helper_marker)

          old_success = '''    expect(api.getSnapshot).toHaveBeenCalledWith('s1')
              expect(screen.getByTestId('node-count')).toHaveTextContent('2')

              fireEvent.change(screen.getByLabelText('테이블 또는 컬럼 검색'), { target: { value: 'users' } })
              expect(screen.getByText('1개 테이블 일치', { exact: false })).toBeInTheDocument()
              fireEvent.click(screen.getByRole('button', { name: 'ERD 자동 정렬' }))
              await act(async () => {
                vi.runOnlyPendingTimers()
                await Promise.resolve()
              })
              expect(screen.getByText('정렬 완료', { exact: false })).toBeInTheDocument()
              fireEvent.click(screen.getByRole('button', { name: '정렬 되돌리기' }))
              expect(screen.getByText('되돌렸습니다', { exact: false })).toBeInTheDocument()
          '''
          new_success = '''    expect(api.getSnapshot).toHaveBeenCalledWith('s1')
              expect(screen.getByTestId('node-count')).toHaveTextContent('2')
              const originalPositions = readNodePositions()

              fireEvent.change(screen.getByLabelText('테이블 또는 컬럼 검색'), { target: { value: 'users' } })
              expect(screen.getByText('1개 테이블 일치', { exact: false })).toBeInTheDocument()
              fireEvent.click(screen.getByRole('button', { name: 'ERD 자동 정렬' }))
              await act(async () => {
                vi.runOnlyPendingTimers()
                await Promise.resolve()
              })
              expect(screen.getByText('정렬 완료', { exact: false })).toBeInTheDocument()
              expect(layout.requireDagreLayout).toHaveBeenCalledWith(
                expect.any(Array),
                expect.any(Array),
                'LR',
              )
              expect(readNodePositions()).toEqual([
                { id: 'table-1', position: { x: 1000, y: 2000 } },
                { id: 'table-2', position: { x: 1100, y: 2100 } },
              ])
              fireEvent.click(screen.getByRole('button', { name: '정렬 되돌리기' }))
              expect(screen.getByText('되돌렸습니다', { exact: false })).toBeInTheDocument()
              expect(readNodePositions()).toEqual(originalPositions)
          '''
          if text.count(old_success) != 1:
              raise SystemExit("auto-layout success test marker changed")
          text = text.replace(old_success, new_success)

          next_test = "  it('shows terminal refresh failures from the polling loop', async () => {"
          failure_test = '''  it('preserves current nodes and the prior undo boundary when layout calculation fails', async () => {
            await renderReadyApp()
            fireEvent.click(screen.getByRole('button', { name: '다이어그램' }))
            const openButtons = await screen.findAllByRole('button', { name: '열기' })
            vi.useFakeTimers()
            fireEvent.click(openButtons[0]!)
            await act(async () => {
              vi.advanceTimersByTime(1000)
              await Promise.resolve()
              await Promise.resolve()
            })
            vi.useRealTimers()

            const originalPositions = readNodePositions()
            fireEvent.click(screen.getByRole('button', { name: 'ERD 자동 정렬' }))
            await screen.findByText('관계 기반 정렬 완료', { exact: false })
            const arrangedPositions = readNodePositions()
            expect(arrangedPositions).not.toEqual(originalPositions)

            const consoleError = vi.spyOn(console, 'error').mockImplementation(() => {})
            layout.requireDagreLayout.mockImplementationOnce(() => {
              throw new Error('layout unavailable')
            })
            fireEvent.click(screen.getByRole('button', { name: 'ERD 자동 정렬' }))
            await screen.findByText('정렬에 실패했습니다. 다시 시도해 주세요.', { exact: false })

            expect(consoleError).toHaveBeenCalledWith(
              'Auto-layout failed',
              expect.objectContaining({ message: 'layout unavailable' }),
            )
            expect(readNodePositions()).toEqual(arrangedPositions)
            fireEvent.click(screen.getByRole('button', { name: '정렬 되돌리기' }))
            expect(readNodePositions()).toEqual(originalPositions)
          })

          '''
          if text.count(next_test) != 1:
              raise SystemExit("layout failure test insertion marker changed")
          text = text.replace(next_test, failure_test + next_test)
          app_test.write_text(text, encoding="utf-8")

          layout_test = Path("frontend/src/erd/dagreLayout.test.ts")
          text = layout_test.read_text(encoding="utf-8")
          marker = '''  it("fails closed and preserves every position when the layout engine throws", () => {'''
          height_test = '''  it("reserves height for rendered detail, overflow, and index rows before measurement", () => {
            const plain = tableNode("plain", { x: 0, y: 0 }, 1)
            const rich = tableNode("rich", { x: 0, y: 0 }, 26)
            rich.data.columns = rich.data.columns.map((column, index) => ({
              ...column,
              column_comment: `comment ${index}`,
              example_value: `example ${index}`,
            }))
            rich.data.indexes = Array.from({ length: 5 }, (_, index) => ({
              index_name: `idx_rich_${index}`,
              columns: ["column_0"],
              access_method: "btree" as const,
              estimated_distinct: 1,
              cardinality_ratio: 1,
              strength: "recommended" as const,
              reason: "test",
              source: "cardinality-wizard" as const,
            }))
            let plainHeight = 0
            let richHeight = 0
            const inspectingEngine: DagreLayoutEngine = (graph) => {
              plainHeight = graph.node("plain").height
              richHeight = graph.node("rich").height
              runDagreLayout(graph)
            }

            const result = computeDagreLayout([plain, rich], [], "LR", inspectingEngine)

            expect(result.applied).toBe(true)
            expect(richHeight).toBeGreaterThan(plainHeight + 1000)
          })

          '''
          if text.count(marker) != 1:
              raise SystemExit("height test insertion marker changed")
          text = text.replace(marker, height_test + marker)
          layout_test.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend graph
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify UI contracts pass and conservative geometry contract is RED
        working-directory: frontend
        run: |
          npm run typecheck
          npm run test -- src/App.coverage.test.tsx
          set +e
          npm run test -- src/erd/dagreLayout.test.ts > /tmp/layout-red.log 2>&1
          status=$?
          set -e
          cat /tmp/layout-red.log
          test "$status" -ne 0
          grep -F "reserves height for rendered detail, overflow, and index rows before measurement" /tmp/layout-red.log
          grep -F "expected 705 to be greater than 1105" /tmp/layout-red.log

      - name: Remove one-shot workflow and publish RED contracts
        env:
          BRANCH_NAME: feat/relationship-aware-auto-layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-layout-review-tests.yml
          git add frontend/src/App.coverage.test.tsx frontend/src/erd/dagreLayout.test.ts
          git diff --cached --check
          git commit -m "test(frontend): cover layout UI state and rich node geometry"
          git push origin "HEAD:${BRANCH_NAME}"
