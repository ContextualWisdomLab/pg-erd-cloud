        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Focused test
        working-directory: frontend
        run: npm run test -- src/App.coverage.test.tsx

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Complete coverage
        working-directory: frontend
        run: npm run coverage

      - name: Production build
        working-directory: frontend
