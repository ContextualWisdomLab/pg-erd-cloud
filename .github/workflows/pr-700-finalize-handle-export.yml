name: PR 700 Finalize Role-Safe Handle Export

on:
  push:
    branches:
      - bolt/optimize-handle-lookup-17383827529551263442
    paths:
      - .github/workflows/pr-700-finalize-handle-export.yml

permissions:
  contents: write

concurrency:
  group: pr-700-finalize-handle-export
  cancel-in-progress: false

jobs:
  finalize-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout current branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: bolt/optimize-handle-lookup-17383827529551263442
          fetch-depth: 0

      - name: Apply bounded source and target handle changes
        run: |
          python - <<'PY'
          from pathlib import Path

          export_path = Path("frontend/src/erd/export.ts")
          source = export_path.read_text(encoding="utf-8")
          replacements = [
              (
                  "import { decodeHandleId } from './handleUtils';",
                  "import {\n  decodeSourceColumnHandleId,\n  decodeTargetColumnHandleId,\n} from './handleUtils';",
              ),
              (
                  "const decodedSource = decodeHandleId(edge.sourceHandle);",
                  "const decodedSource = decodeSourceColumnHandleId(edge.sourceHandle);",
              ),
              (
                  "const decodedTarget = decodeHandleId(edge.targetHandle);",
                  "const decodedTarget = decodeTargetColumnHandleId(edge.targetHandle);",
              ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"expected exactly one export.ts occurrence: {old!r}")
              source = source.replace(old, new)
          export_path.write_text(source, encoding="utf-8")

          test_path = Path("frontend/src/erd/__tests__/exportDataDictionary.test.ts")
          tests = test_path.read_text(encoding="utf-8")
          anchor = "\n\n  it('escapes Markdown table breakers and HTML-like content', () => {"
          regression = """

  it('rejects a target-role handle in the source FK position', () => {
    const edge = {
      id: 'wrong-role',
      source: 'node1',
      target: 'node2',
      sourceHandle: 'tgt-c-0069-0064',
    } as Edge;

    const markdown = exportDictionaryMarkdown(
      [
        {
          id: 'node1',
          data: {
            columns: [
              {
                column_name: 'id',
                data_type: 'int',
                is_pk: false,
                is_not_null: false,
              },
            ],
          },
        },
      ] as Node<TableNodeData>[],
      [edge],
    );

    expect(markdown).toContain('| id | int | N | N | N |  |  |');
  });
"""
          if regression.strip() not in tests:
              if tests.count(anchor) != 1:
                  raise SystemExit("expected one exportDataDictionary test anchor")
              tests = tests.replace(anchor, regression + anchor)
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Run complete frontend coverage
        working-directory: frontend
        run: npm run coverage

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Remove one-shot workflow and publish verified tree
        run: |
          set -euo pipefail
          rm .github/workflows/pr-700-finalize-handle-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/erd/export.ts \
            frontend/src/erd/__tests__/exportDataDictionary.test.ts \
            .github/workflows/pr-700-finalize-handle-export.yml
          git diff --cached --check
          git commit -m "fix(frontend): preserve source and target handle roles"
          git push origin HEAD:bolt/optimize-handle-lookup-17383827529551263442
