name: Unblock PR 693 Repair Workflow

on:
  push:
    branches:
      - bolt-react-flow-cache-5569281215077212328
    paths:
      - .github/workflows/pr-693-unblock-repair.yml

permissions:
  contents: write

jobs:
  repair-workflow-source:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout current branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: bolt-react-flow-cache-5569281215077212328
          fetch-depth: 0

      - name: Remove accidental Markdown fences and retrigger repair
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/repair-pr-693-review-v2.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          filtered = [line for line in lines if line.strip() != '```']
          if filtered == lines:
              raise SystemExit('repair workflow contains no accidental Markdown fence')
          workflow.write_text('\n'.join(filtered) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/pr-693-unblock-repair.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/repair-pr-693-review-v2.yml .github/workflows/pr-693-unblock-repair.yml
          git commit -m 'chore: repair PR 693 current review'
          git push origin HEAD:bolt-react-flow-cache-5569281215077212328
