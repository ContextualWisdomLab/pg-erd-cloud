name: Apply PR 716 Test Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - frontend/src/App.coverage.test.tsx
      - .github/workflows/prepare-pr-716-test-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout maintained branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: jules-3578797244930525994-2c5c0eb4
          fetch-depth: 0

      - name: Make the test wait for snapshot cards
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend/src/App.coverage.test.tsx')
          text = path.read_text()
          test_title = "  it('logs auto-layout failures and preserves nodes added after the undo snapshot'"
          test_start = text.index(test_title)
          timer_marker = '    vi.useFakeTimers()'
          timer_index = text.index(timer_marker, test_start)
          insertion = "    await waitFor(() => expect(screen.getAllByRole('button', { name: '열기' }).length).toBeGreaterThan(0))\n"
          test_prefix = text[test_start:timer_index]
          if insertion not in test_prefix:
              text = text[:timer_index] + insertion + text[timer_index:]
          path.write_text(text)

      - name: Commit deterministic test and remove one-shot artifacts
        run: |
          set -euo pipefail
          git rm .github/repair-pr-716-test.trigger
          git rm .github/workflows/repair-pr-716-test-readiness.yml
          git rm .github/workflows/prepare-pr-716-test-fix.yml
          git add frontend/src/App.coverage.test.tsx
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: stabilize auto-layout snapshot readiness'
          git pull --rebase origin jules-3578797244930525994-2c5c0eb4
          git push origin 'HEAD:jules-3578797244930525994-2c5c0eb4'
