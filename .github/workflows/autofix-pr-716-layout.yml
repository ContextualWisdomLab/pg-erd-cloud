name: Autofix PR 716 Commercial Layout

on:
  push:
    branches:
      - jules-3578797244930525994-2c5c0eb4

permissions:
  contents: write

concurrency:
  group: autofix-pr-716-commercial-layout
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.head_commit.message == 'chore: execute PR 716 layout repair'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: jules-3578797244930525994-2c5c0eb4
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Normalize the maintained Dagre dependency
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('frontend/package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          dependencies = package.setdefault('dependencies', {})
          dependencies.pop('dagre', None)
          dependencies['@dagrejs/dagre'] = '^3.0.0'
          package['dependencies'] = dict(sorted(dependencies.items()))
          dev_dependencies = package.setdefault('devDependencies', {})
          dev_dependencies.pop('@types/dagre', None)
          package['devDependencies'] = dict(sorted(dev_dependencies.items()))
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('frontend/pnpm-lock.yaml').unlink(missing_ok=True)
          PY

      - name: Implement deterministic defensive layout
        shell: bash
        run: |
          set -euo pipefail
          cat > frontend/src/erd/dagreLayout.ts <<'EOF'
          import dagre from '@dagrejs/dagre'
          import type { Edge, Node, XYPosition } from '@xyflow/react'

          import type { TableNodeData } from './convert'

          const NODE_WIDTH = 280
          const HEADER_HEIGHT = 40
          const ROW_HEIGHT = 25
          const FOOTER_HEIGHT = 40
          const MAX_LAYOUT_COLUMNS = 25

          type DagreNodePosition = {
            x?: number
            y?: number
            width?: number
            height?: number
          }

          /** Resolve a Dagre center point to a React Flow top-left position safely. */
          export function resolveDagrePosition(
            original: XYPosition,
            layoutNode: DagreNodePosition | undefined,
          ): XYPosition {
            const x = layoutNode?.x
            const y = layoutNode?.y
            const width = layoutNode?.width
            const height = layoutNode?.height
            if (![x, y, width, height].every((value) => Number.isFinite(value))) {
              return { ...original }
            }
            return {
              x: (x as number) - (width as number) / 2,
              y: (y as number) - (height as number) / 2,
            }
          }

          /** Compute a deterministic hierarchical layout without mutating graph inputs. */
          export function computeDagreLayout(
            nodes: readonly Node<TableNodeData>[],
            edges: readonly Edge[],
            direction: 'TB' | 'LR' = 'LR',
          ): Node<TableNodeData>[] {
            const graph = new dagre.graphlib.Graph()
            graph.setDefaultEdgeLabel(() => ({}))
            graph.setGraph({ rankdir: direction, align: 'UL', ranksep: 120, nodesep: 60 })

            for (const node of nodes) {
              const columnCount = Math.min(node.data.columns?.length ?? 0, MAX_LAYOUT_COLUMNS)
              graph.setNode(node.id, {
                width: NODE_WIDTH,
                height: HEADER_HEIGHT + columnCount * ROW_HEIGHT + FOOTER_HEIGHT,
              })
            }
            for (const edge of edges) graph.setEdge(edge.source, edge.target)

            dagre.layout(graph)

            return nodes.map((node) => ({
              ...node,
              position: resolveDagrePosition(node.position, graph.node(node.id)),
            }))
          }
          EOF

          cat > frontend/src/erd/dagreLayout.test.ts <<'EOF'
          import type { Edge, Node } from '@xyflow/react'
          import { describe, expect, it } from 'vitest'

          import type { TableNodeData } from './convert'
          import { computeDagreLayout, resolveDagrePosition } from './dagreLayout'

          function tableNode(id: string, columnCount = 1): Node<TableNodeData> {
            return {
              id,
              type: 'tableNode',
              position: { x: 7, y: 11 },
              data: {
                title: `public.${id}`,
                columns: Array.from({ length: columnCount }, (_, index) => ({
                  column_name: `column_${index}`,
                  data_type: 'bigint',
                  is_not_null: true,
                  is_pk: index === 0,
                })),
                badges: { pk: true, fk: false },
              },
            }
          }

          describe('resolveDagrePosition', () => {
            it('converts a finite center point and preserves the original for incomplete output', () => {
              expect(resolveDagrePosition({ x: 1, y: 2 }, { x: 100, y: 80, width: 40, height: 20 })).toEqual({ x: 80, y: 70 })
              expect(resolveDagrePosition({ x: 1, y: 2 }, undefined)).toEqual({ x: 1, y: 2 })
              expect(resolveDagrePosition({ x: 3, y: 4 }, { x: Number.NaN, y: 1, width: 1, height: 1 })).toEqual({ x: 3, y: 4 })
            })
          })

          describe('computeDagreLayout', () => {
            it('produces deterministic finite positions without mutating input nodes', () => {
              const nodes = [tableNode('users'), tableNode('orders', 40)]
              const edges: Edge[] = [{ id: 'fk', source: 'users', target: 'orders' }]
              const originalPositions = nodes.map((node) => ({ ...node.position }))

              const first = computeDagreLayout(nodes, edges)
              const second = computeDagreLayout(nodes, edges)

              expect(first.map((node) => node.position)).toEqual(second.map((node) => node.position))
              expect(nodes.map((node) => node.position)).toEqual(originalPositions)
              expect(first).not.toBe(nodes)
              expect(first.every((node) => Number.isFinite(node.position.x) && Number.isFinite(node.position.y))).toBe(true)
              expect(first[0]!.position.x).toBeLessThan(first[1]!.position.x)
            })

            it('supports top-to-bottom and empty graphs', () => {
              const nodes = [tableNode('parent'), tableNode('child')]
              const edges: Edge[] = [{ id: 'fk', source: 'parent', target: 'child' }]
              const vertical = computeDagreLayout(nodes, edges, 'TB')
              expect(vertical[0]!.position.y).toBeLessThan(vertical[1]!.position.y)
              expect(computeDagreLayout([], [])).toEqual([])
            })
          })
          EOF

      - name: Regenerate the canonical npm lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Full coverage
        working-directory: frontend
        run: npm run coverage

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Commit verified layout repair
        shell: bash
        run: |
          set -euo pipefail
          git add -A frontend
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Layout branch is already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(layout): use maintained deterministic Dagre integration'
          git pull --rebase origin jules-3578797244930525994-2c5c0eb4
          git push origin 'HEAD:jules-3578797244930525994-2c5c0eb4'
