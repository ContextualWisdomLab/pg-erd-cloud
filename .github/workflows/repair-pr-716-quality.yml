name: Repair PR 716 Commercial Layout

on:
  push:
    branches:
      - jules-3578797244930525994-2c5c0eb4

permissions:
  contents: write

concurrency:
  group: repair-pr-716-maintained-dagre
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.head_commit.message == 'chore: run PR 716 commercial layout repair'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: jules-3578797244930525994-2c5c0eb4
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Normalize the Dagre dependency and npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('frontend/package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          dependencies = package.setdefault('dependencies', {})
          dependencies.pop('dagre', None)
          dependencies['@dagrejs/dagre'] = '^3.0.0'
          package['dependencies'] = dict(sorted(dependencies.items()))
          dev_dependencies = package.setdefault('devDependencies', {})
          dev_dependencies.pop('@types/dagre', None)
          package['devDependencies'] = dict(sorted(dev_dependencies.items()))
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('frontend/pnpm-lock.yaml').unlink(missing_ok=True)
          PY
          cd frontend
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Implement deterministic defensive layout
        shell: bash
        run: |
          set -euo pipefail
          cat > frontend/src/erd/dagreLayout.ts <<'EOF'
          import dagre from '@dagrejs/dagre'
          import type { Edge, Node, XYPosition } from '@xyflow/react'

          import type { TableNodeData } from './convert'

          const NODE_WIDTH = 280
          const HEADER_HEIGHT = 40
          const ROW_HEIGHT = 25
          const FOOTER_HEIGHT = 40
          const MAX_LAYOUT_COLUMNS = 25

          type DagreNodePosition = {
            x?: number
            y?: number
            width?: number
            height?: number
          }

          /** Resolve a Dagre center point to a React Flow top-left position safely. */
          export function resolveDagrePosition(
            original: XYPosition,
            layoutNode: DagreNodePosition | undefined,
          ): XYPosition {
            const x = layoutNode?.x
            const y = layoutNode?.y
            const width = layoutNode?.width
            const height = layoutNode?.height
            if (![x, y, width, height].every((value) => Number.isFinite(value))) {
              return { ...original }
            }
            return {
              x: (x as number) - (width as number) / 2,
              y: (y as number) - (height as number) / 2,
            }
          }

          /** Compute a deterministic hierarchical layout without mutating graph inputs. */
          export function computeDagreLayout(
            nodes: readonly Node<TableNodeData>[],
            edges: readonly Edge[],
            direction: 'TB' | 'LR' = 'LR',
          ): Node<TableNodeData>[] {
            const graph = new dagre.graphlib.Graph()
            graph.setDefaultEdgeLabel(() => ({}))
            graph.setGraph({ rankdir: direction, align: 'UL', ranksep: 120, nodesep: 60 })

            for (const node of nodes) {
              const columnCount = Math.min(node.data.columns?.length ?? 0, MAX_LAYOUT_COLUMNS)
              graph.setNode(node.id, {
                width: NODE_WIDTH,
                height: HEADER_HEIGHT + columnCount * ROW_HEIGHT + FOOTER_HEIGHT,
              })
            }
            for (const edge of edges) graph.setEdge(edge.source, edge.target)

            dagre.layout(graph)

            return nodes.map((node) => ({
              ...node,
              position: resolveDagrePosition(node.position, graph.node(node.id)),
            }))
          }
          EOF

          cat > frontend/src/erd/dagreLayout.test.ts <<'EOF'
          import type { Edge, Node } from '@xyflow/react'
          import { describe, expect, it } from 'vitest'

          import type { TableNodeData } from './convert'
          import { computeDagreLayout, resolveDagrePosition } from './dagreLayout'

          function tableNode(id: string, x = 0, y = 0): Node<TableNodeData> {
            return {
              id,
              type: 'tableNode',
              position: { x, y },
              data: {
                title: `public.${id}`,
                columns: [{ column_name: 'id', data_type: 'bigint', is_not_null: true, is_pk: true }],
                badges: { pk: true, fk: false },
              },
            }
          }

          function overlaps(left: Node<TableNodeData>, right: Node<TableNodeData>): boolean {
            const width = 280
            const height = 105
            return !(
              left.position.x + width <= right.position.x ||
              right.position.x + width <= left.position.x ||
              left.position.y + height <= right.position.y ||
              right.position.y + height <= left.position.y
            )
          }

          describe('computeDagreLayout', () => {
            it('preserves an empty graph and safely falls back for invalid coordinates', () => {
              expect(computeDagreLayout([], [])).toEqual([])
              expect(resolveDagrePosition({ x: 7, y: 9 }, undefined)).toEqual({ x: 7, y: 9 })
              expect(resolveDagrePosition({ x: 7, y: 9 }, { x: Number.NaN, y: 1, width: 2, height: 3 })).toEqual({ x: 7, y: 9 })
              expect(resolveDagrePosition({ x: 0, y: 0 }, { x: 20, y: 30, width: 10, height: 20 })).toEqual({ x: 15, y: 20 })
            })

            it('lays out one node with finite coordinates while preserving data and input', () => {
              const source = tableNode('users', 11, 13)
              const original = structuredClone(source)
              const result = computeDagreLayout([source], [])
              expect(result).toHaveLength(1)
              expect(Number.isFinite(result[0]!.position.x)).toBe(true)
              expect(Number.isFinite(result[0]!.position.y)).toBe(true)
              expect(result[0]!.id).toBe(source.id)
              expect(result[0]!.data).toBe(source.data)
              expect(source).toEqual(original)
            })

            it('orders a directed chain left-to-right and top-to-bottom', () => {
              const nodes = [tableNode('accounts'), tableNode('orders'), tableNode('items')]
              const edges: Edge[] = [
                { id: 'accounts-orders', source: 'accounts', target: 'orders' },
                { id: 'orders-items', source: 'orders', target: 'items' },
              ]
              const originalNodes = structuredClone(nodes)
              const originalEdges = structuredClone(edges)

              const leftToRight = computeDagreLayout(nodes, edges, 'LR')
              const topToBottom = computeDagreLayout(nodes, edges, 'TB')

              expect(leftToRight[0]!.position.x).toBeLessThan(leftToRight[1]!.position.x)
              expect(leftToRight[1]!.position.x).toBeLessThan(leftToRight[2]!.position.x)
              expect(topToBottom[0]!.position.y).toBeLessThan(topToBottom[1]!.position.y)
              expect(topToBottom[1]!.position.y).toBeLessThan(topToBottom[2]!.position.y)
              expect(nodes).toEqual(originalNodes)
              expect(edges).toEqual(originalEdges)
              expect(leftToRight.map((node) => node.data)).toEqual(nodes.map((node) => node.data))
            })

            it('places disconnected nodes without overlap and produces deterministic output', () => {
              const nodes = [tableNode('users'), tableNode('orders'), tableNode('audit')]
              const first = computeDagreLayout(nodes, [])
              const second = computeDagreLayout(nodes, [])

              expect(first).toEqual(second)
              for (const node of first) {
                expect(Number.isFinite(node.position.x)).toBe(true)
                expect(Number.isFinite(node.position.y)).toBe(true)
              }
              expect(overlaps(first[0]!, first[1]!)).toBe(false)
              expect(overlaps(first[0]!, first[2]!)).toBe(false)
              expect(overlaps(first[1]!, first[2]!)).toBe(false)
            })
          })
          EOF

          python - <<'PY'
          from pathlib import Path

          app_path = Path('frontend/src/App.tsx')
          app = app_path.read_text(encoding='utf-8')
          app = app.replace(
              'import { GRID_COLUMNS, GRID_X_GAP, GRID_Y_GAP } from "./erd/layoutConstants";\n',
              'import { computeDagreLayout } from "./erd/dagreLayout";\n',
          )
          old = '''      // ⚡ Dagre Layout dynamically computed instead of legacy sort grid.
                // Import inline to keep App.tsx independent and avoid circular deps.
                const { computeDagreLayout } = await import("./erd/dagreLayout");
                const next = computeDagreLayout(nodes, edges);
          '''
          new = '''      const next = computeDagreLayout(nodes, edges);
          '''
          if old not in app:
              raise SystemExit('Expected dynamic Dagre import block was not found')
          app = app.replace(old, new)
          app_path.write_text(app, encoding='utf-8')
          PY

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Validate layout and complete frontend
        working-directory: frontend
        run: |
          npm run test -- src/erd/dagreLayout.test.ts
          npm run typecheck
          npm run coverage
          npm run build

      - name: Commit verified repair and remove one-shot automation
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/repair-pr-716-maintained-dagre.yml \
            .github/workflows/repair-pr-716-quality.yml \
            .github/repair-pr-716.trigger \
            .github/repair-pr-716-quality.trigger \
            frontend/pnpm-lock.yaml
          git add frontend/package.json frontend/package-lock.json frontend/src/App.tsx \
            frontend/src/erd/dagreLayout.ts frontend/src/erd/dagreLayout.test.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(frontend): harden deterministic ERD auto-layout'
          git pull --rebase origin jules-3578797244930525994-2c5c0eb4
          git push origin 'HEAD:jules-3578797244930525994-2c5c0eb4'
