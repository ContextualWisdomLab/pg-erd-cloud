name: Repair PR 716

on:
  push:
    branches:
      - jules-3578797244930525994-2c5c0eb4

permissions:
  contents: write

concurrency:
  group: repair-pr-716
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.head_commit.message == 'chore: run PR 716 repair'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"

      - name: Repair implementation, lockfile, and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path


          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")


          app_path = Path("frontend/src/App.tsx")
          replace_once(
              app_path,
              'import { GRID_COLUMNS, GRID_X_GAP, GRID_Y_GAP } from "./erd/layoutConstants";',
              'import { computeDagreLayout } from "./erd/dagreLayout";',
              "App static layout import",
          )
          replace_once(
              app_path,
              '''      // ⚡ Dagre Layout dynamically computed instead of legacy sort grid.
              // Import inline to keep App.tsx independent and avoid circular deps.
              const { computeDagreLayout } = await import("./erd/dagreLayout");
              const next = computeDagreLayout(nodes, edges);''',
              '''      const next = computeDagreLayout(nodes, edges);''',
              "App dynamic import removal",
          )

          coverage_path = Path("frontend/src/App.coverage.test.tsx")
          replace_once(
              coverage_path,
              '''        <span data-testid="edge-count">{props.edges.length}</span>''',
              '''        <span data-testid="edge-count">{props.edges.length}</span>
                      <span data-testid="node-positions">
                        {JSON.stringify(props.nodes.map((node: any) => ({ id: node.id, position: node.position })))}
                      </span>''',
              "React Flow position probe",
          )
          replace_once(
              coverage_path,
              '''    vi.useRealTimers()
              fireEvent.click(screen.getByRole('button', { name: 'ERD 자동 정렬' }))
              await waitFor(() => expect(screen.getByText('정렬 완료', { exact: false })).toBeInTheDocument())
              fireEvent.click(screen.getByRole('button', { name: '정렬 되돌리기' }))
              expect(screen.getByText('되돌렸습니다', { exact: false })).toBeInTheDocument()
              vi.useFakeTimers()''',
              '''    const positionsBeforeLayout = screen.getByTestId('node-positions').textContent
              vi.useRealTimers()
              fireEvent.click(screen.getByRole('button', { name: 'ERD 자동 정렬' }))
              await waitFor(() => expect(screen.getByText('정렬 완료', { exact: false })).toBeInTheDocument())
              const positionsAfterLayout = screen.getByTestId('node-positions').textContent
              expect(positionsAfterLayout).not.toBe(positionsBeforeLayout)
              fireEvent.click(screen.getByRole('button', { name: '정렬 되돌리기' }))
              expect(screen.getByText('되돌렸습니다', { exact: false })).toBeInTheDocument()
              expect(screen.getByTestId('node-positions').textContent).toBe(positionsBeforeLayout)
              vi.useFakeTimers()''',
              "exact undo regression assertion",
          )

          palette_path = Path(".jules/palette.md")
          palette = palette_path.read_text(encoding="utf-8")
          old_heading = "## 2024-08-02 - [UX improvement] ERD Auto Layout 개선 (Dagre 적용)"
          new_section = '''## 2026-08-02 - Relationship-aware ERD auto-layout with maintained Dagre
          **Learning:** A fixed grid hides foreign-key direction and becomes difficult to scan as schemas grow. A deterministic hierarchical layout makes dependency paths visible while stable insertion order prevents visual jitter between identical snapshots.
          **Action:** Use the maintained, typed `@dagrejs/dagre` package with the repository's npm lockfile; size nodes from rendered column counts; ignore dangling edges; preserve node and edge data; validate finite coordinates; and verify LR/TB direction, cycles, determinism, non-overlap, immutability, and exact undo restoration in tests.
          '''
          if old_heading in palette:
              palette = palette.split(old_heading, 1)[0].rstrip() + "\n\n" + new_section
          elif "## 2026-08-02 - Relationship-aware ERD auto-layout with maintained Dagre" not in palette:
              palette = palette.rstrip() + "\n\n" + new_section
          palette_path.write_text(palette, encoding="utf-8")

          Path("frontend/pnpm-lock.yaml").unlink(missing_ok=True)
          PY

          npm install --prefix frontend --package-lock-only --ignore-scripts
          npm ci --prefix frontend
          npm run --prefix frontend typecheck
          npm run --prefix frontend coverage
          npm run --prefix frontend build
          git diff --check

          rm .github/workflows/repair-pr-716.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(frontend): complete deterministic Dagre auto-layout"
          git push origin "HEAD:${GITHUB_REF_NAME}"
