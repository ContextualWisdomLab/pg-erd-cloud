name: Repair PR 716

on:
  push:
    branches:
      - jules-3578797244930525994-2c5c0eb4

permissions:
  contents: write

concurrency:
  group: repair-pr-716
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.head_commit.message == 'chore: run PR 716 repair'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Align application import and engineering record
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path


          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")


          app_path = Path("frontend/src/App.tsx")
          replace_once(
              app_path,
              'import { GRID_COLUMNS, GRID_X_GAP, GRID_Y_GAP } from "./erd/layoutConstants";\n',
              'import { computeDagreLayout } from "./erd/dagreLayout";\n',
              "static Dagre import",
          )
          replace_once(
              app_path,
              '      // ⚡ Dagre Layout dynamically computed instead of legacy sort grid.\n',
              "",
              "obsolete dynamic-layout comment",
          )
          replace_once(
              app_path,
              '      // Import inline to keep App.tsx independent and avoid circular deps.\n',
              "",
              "obsolete dynamic-import comment",
          )
          replace_once(
              app_path,
              '      const { computeDagreLayout } = await import("./erd/dagreLayout");\n',
              "",
              "dynamic Dagre import",
          )

          palette_path = Path(".jules/palette.md")
          palette = palette_path.read_text(encoding="utf-8")
          replacement = '''
          ## 2026-08-03 - Relationship-aware ERD auto-layout
          **Learning:** A fixed grid hides foreign-key direction and becomes difficult to scan as schemas grow. A deterministic hierarchical layout makes dependency paths visible while stable insertion order prevents visual jitter between identical snapshots.
          **Action:** Use the maintained, typed `@dagrejs/dagre` package with the repository's canonical npm lockfile; size nodes from rendered column counts; ignore dangling edges; handle cycles; validate finite coordinates; and verify LR/TB direction, determinism, non-overlap, and input immutability in focused tests.
          '''.strip()
          updated, count = re.subn(
              r"\n## 2024-08-02 - \[UX improvement\] ERD Auto Layout 개선 \(Dagre 적용\).*\Z",
              "\n" + replacement + "\n",
              palette,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f"palette record: expected one match, found {count}")
          palette_path.write_text(updated, encoding="utf-8")
          PY

      - name: Regenerate canonical npm lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Coverage
        working-directory: frontend
        run: npm run coverage

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Commit verified repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-pr-716.yml
          git add .jules/palette.md frontend/package-lock.json frontend/src/App.tsx
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(layout): complete verified hierarchical layout integration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
