version: 2

updates:
  # Keep pinned GitHub Actions (SHA) fresh.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    # Enforce a 7-day cooldown for new releases to mitigate dependency confusion/takeover attacks
    custom-ecosystem-attributes:
      cooldown: 7

  # Keep Python dependencies fresh.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    # Enforce a 7-day cooldown for new releases to mitigate dependency confusion/takeover attacks
    custom-ecosystem-attributes:
      cooldown: 7

  # Keep Node.js dependencies fresh.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    # Enforce a 7-day cooldown for new releases to mitigate dependency confusion/takeover attacks
    custom-ecosystem-attributes:
      cooldown: 7

  # Keep Docker base image digests fresh.
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    # Enforce a 7-day cooldown for new releases to mitigate dependency confusion/takeover attacks
    custom-ecosystem-attributes:
      cooldown: 7

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    # Enforce a 7-day cooldown for new releases to mitigate dependency confusion/takeover attacks
    custom-ecosystem-attributes:
      cooldown: 7
