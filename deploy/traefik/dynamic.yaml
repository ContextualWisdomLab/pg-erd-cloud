http:
  routers:
    healthz:
      rule: Path(`/healthz`)
      entryPoints:
        - websecure
      service: backend
      priority: 110
      middlewares:
        - security-headers
      tls:
        options: hardened

    api:
      rule: PathPrefix(`/api`)
      entryPoints:
        - websecure
      service: backend
      priority: 100
      middlewares:
        - security-headers
      tls:
        options: hardened

    frontend:
      rule: PathPrefix(`/`)
      entryPoints:
        - websecure
      service: frontend
      priority: 1
      middlewares:
        - security-headers
      tls:
        options: hardened

  services:
    backend:
      loadBalancer:
        servers:
          - url: http://backend:8000

    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:8080

  middlewares:
    security-headers:
      headers:
        contentTypeNosniff: true
        customFrameOptionsValue: DENY
        referrerPolicy: no-referrer
        permissionsPolicy: geolocation=(), microphone=(), camera=()
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true

tls:
  certificates:
    - certFile: /run/secrets/tls_certificate
      keyFile: /run/secrets/tls_private_key
  options:
    hardened:
      minVersion: VersionTLS12
      sniStrict: true
